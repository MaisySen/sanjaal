name: App lifecycle and draft regression
on:
  push:
    branches: [app-lifecycle-draft-validation]
permissions:
  contents: read
concurrency:
  group: lifecycle-draft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - name: Preserve test and render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-draft-tests
          path: |
            app/analyze.log
            app/test.log
            app/test/renders/saved_drafts_conflict_*.png
          retention-days: 7
