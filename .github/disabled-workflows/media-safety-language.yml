name: Media safety language and exit coverage
on:
  push:
    branches: [media-safety-localization, product-integrated-overnight]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: flutter test test/media_safety_language_test.dart test/call_media_guard_test.dart test/room_microphone_test.dart test/call_status_layout_test.dart test/room_failure_layout_test.dart test/room_consent_render_test.dart test/realtime_session_test.dart --reporter expanded > focused.log 2>&1
      - name: Historical call status translation negative control
        run: |
          cp lib/call_page.dart /tmp/call-language-protected.dart
          trap 'cp /tmp/call-language-protected.dart lib/call_page.dart' EXIT
          git show cb3093d457d130ad1afadd3b7d6755d9dfc376b2:app/lib/call_page.dart > lib/call_page.dart
          set +e
          timeout --kill-after=10s 90 flutter test test/media_safety_language_test.dart --plain-name 'safety warning call ne landscape=false light' --reporter expanded > call-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' call-negative.log
          cp /tmp/call-language-protected.dart lib/call_page.dart
      - name: Historical room warning translation negative control
        run: |
          cp lib/rooms_page.dart /tmp/room-language-protected.dart
          trap 'cp /tmp/room-language-protected.dart lib/rooms_page.dart' EXIT
          git show cb3093d457d130ad1afadd3b7d6755d9dfc376b2:app/lib/rooms_page.dart > lib/rooms_page.dart
          set +e
          timeout --kill-after=10s 90 flutter test test/media_safety_language_test.dart --plain-name 'safety warning room ne landscape=false light' --reporter expanded > room-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' room-negative.log
          cp /tmp/room-language-protected.dart lib/rooms_page.dart
      - run: flutter test test/media_safety_language_test.dart --reporter expanded > restored.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-safety-language-evidence
          path: |
            app/*.log
            app/test/renders/media_safety*.png
          retention-days: 7
