name: Native screenshot readiness
on:
  push:
    branches: [native-capture-readiness, native-camera-first-frame]
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: app
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - name: Start local API with a synthetic member (isolated, no Auth0, no live data)
        working-directory: api
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
          APP_ENV: local
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/e2e/db.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -e
          composer install --no-interaction --prefer-dist --no-progress
          python3 tests/E2E/native_input_contract.py
          python3 tests/E2E/native_media_contract.py
          mkdir -p /tmp/e2e && touch /tmp/e2e/db.sqlite .env
          php artisan migrate --force
          php tests/E2E/prepare.php /tmp/e2e
          echo "::add-mask::$(cat /tmp/e2e/token.txt)"
          echo "::add-mask::$(cat /tmp/e2e/viewer-token.txt)"
          E2E_NATIVE_INPUT=1 E2E_JWKS_FILE=/tmp/e2e/jwks.json nohup php -S 0.0.0.0:8000 -t public tests/E2E/server.php > /tmp/e2e/server.log 2>&1 &
          E2E_FAULT_AFTER_COMMIT=1 UPLOAD_INTENTS_ENABLED=true E2E_NATIVE_INPUT=1 E2E_JWKS_FILE=/tmp/e2e/jwks.json nohup php -S 0.0.0.0:8001 -t public tests/E2E/server.php > /tmp/e2e/server2.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "unauthenticated /me status %{http_code}\n" http://127.0.0.1:8000/api/v1/auth/me -H 'Accept: application/json'
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/ci/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: |
            app/build/screenshots/*.png
            app/build/screenshots/*.mp4
            app/build/screenshots/*.txt
            app/build/screenshots/*.xml
            /tmp/drive_*.log
          if-no-files-found: warn
      - name: Publish emulator screenshots
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/shots && cp app/build/screenshots/*.png app/build/screenshots/*.mp4 /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q -b emulator-shots
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "Emulator screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" emulator-shots

