name: Profile editor session ownership
on:
  push:
    branches: [profile-editor-session-ownership]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: flutter test test/profile_editor_session_test.dart test/profile_journey_test.dart test/upload_session_test.dart --reporter expanded > focused.log 2>&1
      - name: Historical unbound editor negative control
        run: |
          cp lib/profile_pages.dart /tmp/profile-protected.dart
          trap 'cp /tmp/profile-protected.dart lib/profile_pages.dart' EXIT
          git show 64c5b0c18881b1c69ba131e9c4544a2e32a5344a:app/lib/profile_pages.dart > lib/profile_pages.dart
          set +e
          timeout --kill-after=10s 90 flutter test test/profile_editor_session_test.dart --plain-name 'profile editor retires edited text on other member login' --reporter expanded > negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' negative.log
          cp /tmp/profile-protected.dart lib/profile_pages.dart
      - run: flutter test test/profile_editor_session_test.dart test/profile_journey_test.dart test/upload_session_test.dart --reporter expanded > restored.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - run: flutter build apk --debug > build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-editor-session-evidence
          path: app/*.log
          retention-days: 7
