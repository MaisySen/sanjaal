name: Android saved draft process restart
on:
  push:
    branches: [android-saved-draft-restart]
permissions:
  contents: read
concurrency:
  group: upload-process-death-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-draft-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos lib/upload_pending_store.dart lib/upload_center.dart integration_test/android_draft_restart_test.dart
        working-directory: app
      - name: Seed, force-stop, relaunch without clearing package data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/ci/android-draft-restart.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-draft-restart
          path: |
            app/build/screenshots/draft_restart_*.png
            app/build/screenshots/process_death_*.log
          retention-days: 7
