name: Exact reviewed df1b7ce Android package verification
'on':
  push:
    branches: [reviewed-background-native-compile]
permissions:
  contents: read
concurrency:
  group: reviewed-background-native-compile
  cancel-in-progress: false
jobs:
  exact-reviewed-package:
    if: github.repository == 'MaisySen/sanjaal' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REVIEWED_SOURCE: df1b7ced4daf1773aa4fb9490bd1dad4ea48c103
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        ref: df1b7ced4daf1773aa4fb9490bd1dad4ea48c103
        path: exact-source
        persist-credentials: false
    - name: Verify exact reviewed source, no substituted app tree
      working-directory: exact-source
      run: |
        test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
        test "$(git rev-parse HEAD:app)" = "5e1d6562b4f0ba0fa51d5ed75cc3bcda444cff5a"
        test -z "$(git status --porcelain)"
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Verify lint runtime supports bundled Java parser JDK21 APIs
      run: java -version
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: '3.50.0'
        cache: false
    - name: Build release only from fresh reviewed source workspace
      working-directory: exact-source/app
      run: |
        flutter --version
        flutter clean
        flutter pub get --enforce-lockfile
        flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/debug-info --dart-define=API_BASE_URL=https://sanjaal-api.onrender.com/api/v1
    - name: Independently verify exact source and engineering APK checksum
      run: python3 .github/ci/check_engineering_package.py --source-repo exact-source --source-sha "$REVIEWED_SOURCE"
    # No artifact/cache upload, stable signing, distribution, deployment or provider activation.
