name: CI

on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env && php artisan test
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=

  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^\s+(error|warning)" analyze.log | head -40 | sed 's/%/%25/g' | while read -r l; do echo "::error title=analyze::$l"; done
          fi
          tail -3 analyze.log
          exit $code
      - run: flutter test
      - name: Publish rendered previews
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/renders && cp test/renders/*.png /tmp/renders/
          cd /tmp/renders
          git init -q -b renders
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "Rendered previews for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" renders
      - name: Build release APK
        run: |
          set +e
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://sanjaal-api.onrender.com/api/v1' }} > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|FAILURE|What went wrong|Execution failed|Caused by|minSdk|Could not" -A2 build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3500 | while read -r l; do echo "::error title=APK build::$l"; done
          fi
          tail -5 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://sanjaal-api.onrender.com/api/v1' }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr sanjaal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-ios-unsigned
          path: app/sanjaal-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [api, app, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          mkdir out
          cp sanjaal-apk/*.apk out/
          cp sanjaal-ios-unsigned/*.ipa out/
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Sanjaal ${GITHUB_REF_NAME#v}" \
            --notes "Android APKs per CPU type (arm64-v8a for most phones) and an unsigned iOS build that cannot be installed on a phone until it is signed. Check the SHA256SUMS.txt file." *
