name: CI

on:
  push:
    tags: ['v*']
    branches: ['**', '!ios-platform-readiness', '!ios-auth-inputs', '!ios-session-response', '!ios-social-callback', '!capture-permission-recovery', '!room-join-lifecycle', '!creator-draft-delete-guard', '!app-lifecycle-draft-validation', '!upload-session-ownership', '!app-followthrough-native-compile', '!private-media-session-ownership', '!private-media-native-compile', '!signout-local-boundary', '!signout-native-compile', '!upload-marker-ownership', '!upload-process-death-native', '!upload-center-session-generation', '!native-capture-readiness', '!upload-discard-confirmation-ownership', '!ios-direct-vm-attach', '!ios-marker-process-restart', '!ios-manual-retry-native', '!ios-saved-draft-restart', '!android-saved-draft-restart', '!creator-media-draft-preservation', '!creator-story-draft-preservation', '!chat-screen-session-ownership', '!realtime-session-ownership', '!recovered-video-memory-preview', '!current-group-save-recovery']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: sanjaal
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: sanjaal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanjaal -d sanjaal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env && php artisan test
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
      # The deployed image caches routes and events at start. Run the whole suite again that way.
      - run: |
          touch .env
          php artisan route:cache && php artisan event:cache
          php artisan test
          php artisan route:clear && php artisan event:clear
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=

      - name: PostgreSQL 18 API and concurrent invariant checks (throwaway service only)
        run: |
          php artisan test
          php artisan route:cache && php artisan event:cache
          php artisan test
          php artisan route:clear && php artisan event:clear
          PG_RACE=1 php artisan test tests/Concurrency
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sanjaal_test
          DB_USERNAME: sanjaal
          DB_PASSWORD: local-fixture-only

  timing-image-check:
    name: historical timing image parity (dcbb source)
    # The live v40 image and the timing candidate image (live image + one layer, 2 files), both run against the SAME throwaway
    # database migrated by v40 source (the live schema). Compares status and body for each request and shows the timing headers.
    runs-on: ubuntu-latest
    env:
      LIVE_IMAGE: sanjaalapp/sanjaal-api@sha256:b384617b848d0d53c6e24889950cdfeb7d4da6c1962b9dda599058533eb84f19
      CAND_IMAGE: sanjaalapp/sanjaal-api@sha256:29858723492076017fac63d273423243eb48f53cc3410dbe03a927b38c78eb66
      APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sanjaal_test
      DB_USERNAME: sanjaal
      DB_PASSWORD: local-fixture-only
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: sanjaal
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: sanjaal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanjaal -d sanjaal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, bcmath, gd
          coverage: none
      - name: Migrate the throwaway database with v40 source and seed synthetic data
        working-directory: api
        run: |
          touch .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan migrate --force
          php artisan tinker --execute='$id=(string)\Illuminate\Support\Str::uuid(); \App\Support\MediaStore::put($id,"image/png",base64_decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jZ1kAAAAASUVORK5CYII="),false); \App\Models\User::factory()->create(["avatar"=>$id]); file_put_contents("/tmp/avatar_id",$id);'
          php artisan tinker --execute='require base_path("tests/Compat/seed_v40.php");'
          php artisan tinker --execute='require base_path("tests/Compat/seed_reads.php");'
          test -s /tmp/avatar_id && test -s /tmp/compat/owner.jwt
          docker run --rm --network host -e PGPASSWORD=local-fixture-only postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015 psql -h 127.0.0.1 -U sanjaal -d sanjaal_test -tAc "select count(*) from migrations; select count(*) from information_schema.columns where table_name='conversations' and column_name='add_policy';" | tr '\n' ' ' | tee /tmp/schema_before.txt; echo
      - name: Run each image in turn against that database and compare
        run: |
          # This pinned image predates the group-member-ref API contract. Keep
          # its byte-integrity assertion against the exact verified source it
          # represents, not a claim that it is the current source/API image.
          git fetch --no-tags --depth=1 origin dcbb6fe58416ef6b979155b5da287aa7d7bb25fd
          test "$(git rev-parse FETCH_HEAD)" = dcbb6fe58416ef6b979155b5da287aa7d7bb25fd
          docker create --name inspect-candidate "$CAND_IMAGE" >/dev/null
          for p in app/Http/Controllers/PostController.php app/Http/Controllers/ChatController.php app/Http/Controllers/EngagementController.php app/Http/Resources/Present.php; do
            docker cp "inspect-candidate:/app/$p" /tmp/image-file
            git show "FETCH_HEAD:api/$p" > /tmp/pinned-image-source
            cmp /tmp/pinned-image-source /tmp/image-file
          done
          docker rm inspect-candidate >/dev/null
          # One at a time: with host networking both would share php-fpm's fixed local port, and the second would silently be served by the first.
          O="Authorization: Bearer $(cat /tmp/compat/owner.jwt)"; aid=$(cat /tmp/avatar_id)
          SPECS="/api/v1/ping 0|/api/v1/media/$aid 0|/api/v1/media/00000000-0000-4000-8000-000000000000 0|/api/v1/auth/me 0|/api/v1/auth/me 1|/api/v1/posts 1|/api/v1/conversations 1|/api/v1/rooms 1|/api/v1/stories 1|/api/v1/wallet 1"
          SPECS="$SPECS|$(cat /tmp/compat/read_specs)"
          hit() { if [ "$2" = 1 ]; then curl -s -D /tmp/h -o /tmp/b -w '%{http_code}' -H "$O" -H 'Accept: application/json' "http://127.0.0.1:10000$1"; else curl -s -D /tmp/h -o /tmp/b -w '%{http_code}' -H 'Accept: application/json' "http://127.0.0.1:10000$1"; fi; }
          run_image() { # name image
            docker run -d --name $1 --network host -e PORT=10000 -e APP_ENV=production -e APP_KEY -e DB_CONNECTION -e DB_HOST -e DB_PORT -e DB_DATABASE -e DB_USERNAME -e DB_PASSWORD -e AUTH0_DOMAIN=tenant.example.auth0.com -e AUTH0_AUDIENCE=https://api.test "$2" >/dev/null
            for i in $(seq 1 60); do curl -fsS http://127.0.0.1:10000/api/v1/ping >/dev/null 2>&1 && break; sleep 2; done
            test "$(docker inspect -f '{{.State.Running}}' $1)" = true
            docker cp /tmp/compat/jwks.json $1:/tmp/jwks.json; docker exec $1 chmod 644 /tmp/jwks.json
            docker exec -u nobody $1 php -r 'require "/app/vendor/autoload.php"; $app = require "/app/bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); Illuminate\Support\Facades\Cache::put("auth0.jwks", json_decode(file_get_contents("/tmp/jwks.json"), true), 3600);'
            if [ "$1" = cand ]; then
              docker cp api/tests/Compat/connector_runtime.php $1:/tmp/connector_runtime.php
              docker exec $1 php /tmp/connector_runtime.php
            fi
            echo "$1 runs $(docker inspect -f '{{.Image}}' $1)"
            : > /tmp/res.$1; : > /tmp/queries.$1
            echo "$SPECS" | tr '|' '\n' | while read -r path a; do
              hit "$path" $a >/dev/null            # warm: the first signed-in request verifies the token and fills the claims cache
              sc=$(hit "$path" $a)
              if [ "$path" = /api/v1/posts ]; then python3 -c 'import json; x=json.load(open("/tmp/b")); assert len(x["data"]) > 0 and len(x["data"][0]["media"]) > 0 and len(x["data"][0]["hashtags"]) > 0'; fi
              h=$(python3 api/tests/Compat/canonical_hash.py /tmp/b); t=$(grep -i '^server-timing' /tmp/h | tr -d '\r' | cut -d' ' -f2-)
              q=$(printf '%s' "$t" | grep -oE '[0-9]+ queries' | head -1)
              echo "$path auth=$a $sc $h" >> /tmp/res.$1; echo "$path auth=$a $q" >> /tmp/queries.$1; echo "  $1 $path auth=$a -> $sc $h [$t]"
              if [ "$path" = /api/v1/auth/me ] && [ "$a" = 1 ]; then echo "$t" > /tmp/me_timing.$1; fi
            done
            docker logs $1 2>&1 | grep -i -E 'migrat|nothing to' | head -3
            docker stop $1 >/dev/null; docker rm $1 >/dev/null
          }
          run_image live "$LIVE_IMAGE"
          run_image cand "$CAND_IMAGE"
          echo "== compare status and body hash, live vs candidate"; diff /tmp/res.live /tmp/res.cand && echo "identical status and body for every request"
          python3 api/tests/Compat/compare_read_counts.py /tmp/queries.live /tmp/queries.cand
          echo "BASE query counts"; cat /tmp/queries.live; echo "CAND query counts"; cat /tmp/queries.cand
          echo "live signed-in /auth/me timing: $(cat /tmp/me_timing.live)"; echo "cand signed-in /auth/me timing: $(cat /tmp/me_timing.cand)"
          grep -qE 'desc="[1-9][0-9]* queries".*boot;dur=' /tmp/me_timing.cand
          grep -qE 'connect;dur=[0-9.]+;desc="[1-9][0-9]* connector calls"' /tmp/me_timing.cand
          echo "connector time remains nested inside db time; no speed inference from CI"
          docker run --rm --network host -e PGPASSWORD=local-fixture-only postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015 psql -h 127.0.0.1 -U sanjaal -d sanjaal_test -tAc "select count(*) from migrations; select count(*) from information_schema.columns where table_name='conversations' and column_name='add_policy';" | tr '\n' ' ' > /tmp/schema_after.txt
          diff /tmp/schema_before.txt /tmp/schema_after.txt && echo "schema unchanged: $(cat /tmp/schema_after.txt)"

  app:
    if: github.ref != 'refs/heads/timing-connector-candidate' && github.ref != 'refs/heads/read-reduction-on-v43'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Phone preview finalizer unit contracts (fake Android tools)
        run: python3 .github/ci/test_finalize_phone_preview.py && python3 .github/ci/test_finalize_play_bundle.py && python3 .github/ci/test_candidate_manifest.py && python3 -O .github/ci/test_finalize_phone_preview.py && python3 -O .github/ci/test_finalize_play_bundle.py && python3 -O .github/ci/test_candidate_manifest.py
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "(error|warning) (•|-)|^(error|warning)" analyze.log | head -40 | cut -c1-300 | sed 's/%/%25/g' | while read -r l; do echo "::error title=analyze::$l"; done
          fi
          tail -3 analyze.log
          exit $code
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -n -E "\[E\]|EXCEPTION|Exception|Expected|Actual|Error:|\.dart:[0-9]+" test.log | head -30 | cut -c1-300 | sed 's/%/%25/g' | while read -r l; do echo "::error title=test::$l"; done
          fi
          tail -3 test.log
          exit $code
      - name: Preserve exact-head renders and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-renders-and-tests
          path: |
            app/test/renders/*.png
            app/test.log
            app/analyze.log
          retention-days: 7
      - name: Publish rendered previews
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/renders && cp test/renders/*.png /tmp/renders/
          cd /tmp/renders
          git init -q -b renders
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "Rendered previews for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" renders
      - name: Build release APK
        run: |
          set +e
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL=https://sanjaal-api.onrender.com/api/v1 > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|FAILURE|What went wrong|Execution failed|Caused by|minSdk|Could not" -A2 build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3500 | while read -r l; do echo "::error title=APK build::$l"; done
          fi
          if [ $code -ne 0 ]; then tail -100 build.log; else tail -5 build.log; fi
          exit $code
      - name: Preserve app failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-failure-logs
          path: |
            app/analyze.log
            app/test.log
            app/build.log
          if-no-files-found: ignore
      - name: Fail closed - the user APK must carry no test endpoint, test token or tunnel
        run: |
          set -e
          expected_version=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          expected_code=$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)
          [ "$expected_code" -ge 2008 ]
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$aapt"
          cd build/app/outputs/flutter-apk
          n=0
          for f in *.apk; do
            n=$((n+1))
            echo "checking $f"
            "$aapt" dump badging "$f" > /tmp/sanjaal-apk-version.txt
            grep -F "package: name='au.fintex.sanjaal' versionCode='$expected_code' versionName='$expected_version'" /tmp/sanjaal-apk-version.txt
            unzip -tq "$f"
            mkdir -p "/tmp/x/$f"
            unzip -qo "$f" -d "/tmp/x/$f"
            [ -f "/tmp/x/$f/AndroidManifest.xml" ] && [ -f "/tmp/x/$f/classes.dex" ] && find "/tmp/x/$f/lib" -name libapp.so | grep -q . || { echo "::error::incomplete apk $f"; exit 1; }
            if grep -raEl 'trycloudflare|local-e2e|10\.0\.2\.2|E2E_TOKEN' "/tmp/x/$f"; then echo "::error::test-only string found in $f"; exit 1; fi
            grep -qa 'sanjaal-api.onrender.com' -r "/tmp/x/$f/lib" || { echo "::error::expected API default not found in $f"; exit 1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no apk found"; exit 1; }
          echo "checked $n apk(s): clean"
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  # Private engineering artifact only. It has no signature, upload or release step.
  bundle:
    if: github.ref != 'refs/heads/timing-connector-candidate' && github.ref != 'refs/heads/read-reduction-on-v43'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Build unsigned ARM64 engineering bundle
        env:
          SANJAAL_UNSIGNED_BUNDLE: '1'
        run: |
          flutter build appbundle --release --target-platform android-arm64 --obfuscate \
            --split-debug-info=build/bundle-debug-info \
            --dart-define=API_BASE_URL=https://sanjaal-api.onrender.com/api/v1
          python3 - <<'PY_BUNDLE'
          import zipfile
          from pathlib import Path
          p=Path('build/app/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert not any(n.upper().endswith(('.RSA','.DSA','.EC','.SF')) and n.upper().startswith('META-INF/') for n in names), 'AAB must be unsigned'
              assert {'BundleConfig.pb','base/manifest/AndroidManifest.xml','base/lib/arm64-v8a/libapp.so'}.issubset(names)
              libs=[n for n in names if n.startswith('base/lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('base/lib/arm64-v8a/') for n in libs), 'Incomplete extra ABI in ARM64 bundle'
              for n in names:
                  if not n.endswith('/'):
                      b=z.read(n)
                      assert not any(t in b for t in [b'trycloudflare',b'local-e2e',b'10.0.2.2',b'E2E_TOKEN']), 'Test-only marker: '+n
              assert b'https://sanjaal-api.onrender.com/api/v1' in z.read('base/lib/arm64-v8a/libapp.so')
          PY_BUNDLE
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-unsigned-aab-engineering-only
          path: |
            app/build/app/outputs/bundle/release/*.aab
            app/build/bundle-debug-info/
          retention-days: 7

  emulator:
    if: github.ref != 'refs/heads/timing-connector-candidate' && github.ref != 'refs/heads/read-reduction-on-v43'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: app
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - name: Start local API with a synthetic member (isolated, no Auth0, no live data)
        working-directory: api
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
          APP_ENV: local
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/e2e/db.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -e
          composer install --no-interaction --prefer-dist --no-progress
          python3 tests/E2E/native_input_contract.py
          python3 tests/E2E/native_media_contract.py
          mkdir -p /tmp/e2e && touch /tmp/e2e/db.sqlite .env
          php artisan migrate --force
          php tests/E2E/prepare.php /tmp/e2e
          echo "::add-mask::$(cat /tmp/e2e/token.txt)"
          echo "::add-mask::$(cat /tmp/e2e/viewer-token.txt)"
          E2E_NATIVE_INPUT=1 E2E_JWKS_FILE=/tmp/e2e/jwks.json nohup php -S 0.0.0.0:8000 -t public tests/E2E/server.php > /tmp/e2e/server.log 2>&1 &
          E2E_FAULT_AFTER_COMMIT=1 UPLOAD_INTENTS_ENABLED=true E2E_NATIVE_INPUT=1 E2E_JWKS_FILE=/tmp/e2e/jwks.json nohup php -S 0.0.0.0:8001 -t public tests/E2E/server.php > /tmp/e2e/server2.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "unauthenticated /me status %{http_code}\n" http://127.0.0.1:8000/api/v1/auth/me -H 'Accept: application/json'
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/ci/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: |
            app/build/screenshots/*.png
            app/build/screenshots/*.mp4
            app/build/screenshots/*.txt
            app/build/screenshots/*.xml
            /tmp/drive_*.log
          if-no-files-found: warn
      - name: Publish emulator screenshots
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/shots && cp app/build/screenshots/*.png app/build/screenshots/*.mp4 /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q -b emulator-shots
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "Emulator screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" emulator-shots

  ios:
    if: github.ref != 'refs/heads/timing-connector-candidate' && github.ref != 'refs/heads/read-reduction-on-v43'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=https://sanjaal-api.onrender.com/api/v1
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr sanjaal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-ios-unsigned
          path: app/sanjaal-unsigned.ipa

  # Publishing is deliberately closed until stable-key signing is integrated.
  # The ordinary app artifact is debug-signed even in release mode.
  # A tag alone must never ship it, or bypass genuine native-input checks.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && false
    needs: [api, app, ios, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          mkdir out
          cp sanjaal-apk/*.apk out/
          cp sanjaal-ios-unsigned/*.ipa out/
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Sanjaal ${GITHUB_REF_NAME#v}" \
            --notes "Android APKs per CPU type (arm64-v8a for most phones) and an unsigned iOS build that cannot be installed on a phone until it is signed. Check the SHA256SUMS.txt file." *

  exact-money-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unpublished exact-current-source image and verify integrity
        run: |
          BASE=sanjaalapp/sanjaal-api@sha256:29858723492076017fac63d273423243eb48f53cc3410dbe03a927b38c78eb66
          docker pull "$BASE"
          docker create --name baseline "$BASE" >/dev/null
          docker cp baseline:/app/composer.lock /tmp/runtime-composer.lock
          cmp api/composer.lock /tmp/runtime-composer.lock
          docker rm baseline
          # Preserve the pinned vendor/runtime; replace all tracked source trees.
          printf 'FROM %s\nUSER root\nRUN rm -rf /app/app /app/bootstrap /app/config /app/database /app/public /app/resources /app/routes /app/tests\nCOPY api/ /app/\n' "$BASE" > /tmp/ExactCurrent.Dockerfile
          docker build --pull=false -f /tmp/ExactCurrent.Dockerfile -t sanjaal-current:${{ github.sha }} .
          docker create --name integrity sanjaal-current:${{ github.sha }} >/dev/null
          docker cp integrity:/app /tmp/exact-current-api
          git ls-files -z api | while IFS= read -r -d '' p; do cmp "$p" "/tmp/exact-current-api/${p#api/}"; done
          docker rm integrity
      - name: Current source refuses money and malformed group IDs without network or DB
        run: |
          IMAGE=sanjaal-current:${{ github.sha }}
          docker create --name hold --network none --entrypoint sh "$IMAGE" -c 'sleep 120'
          docker start hold
          docker cp api/tests/Compat/wallet_hold_runtime.php hold:/tmp/wallet_hold_runtime.php
          docker exec hold php /tmp/wallet_hold_runtime.php
          docker exec hold php /app/tests/Compat/group_ref_validation_runtime.php
          docker rm -f hold
