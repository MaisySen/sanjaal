name: CI

on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: sanjaal
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: sanjaal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanjaal -d sanjaal_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env && php artisan test
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
      # The deployed image caches routes and events at start. Run the whole suite again that way.
      - run: |
          touch .env
          php artisan route:cache && php artisan event:cache
          php artisan test
          php artisan route:clear && php artisan event:clear
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=

      - name: PostgreSQL 18 API and concurrent invariant checks (throwaway service only)
        run: |
          php artisan test
          php artisan route:cache && php artisan event:cache
          php artisan test
          php artisan route:clear && php artisan event:clear
          PG_RACE=1 php artisan test tests/Concurrency
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: sanjaal_test
          DB_USERNAME: sanjaal
          DB_PASSWORD: local-fixture-only

  app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Phone preview finalizer unit contracts (fake Android tools)
        run: python3 .github/ci/test_finalize_phone_preview.py && python3 .github/ci/test_finalize_play_bundle.py && python3 .github/ci/test_candidate_manifest.py && python3 -O .github/ci/test_finalize_phone_preview.py && python3 -O .github/ci/test_finalize_play_bundle.py && python3 -O .github/ci/test_candidate_manifest.py
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "(error|warning) (•|-)|^(error|warning)" analyze.log | head -40 | cut -c1-300 | sed 's/%/%25/g' | while read -r l; do echo "::error title=analyze::$l"; done
          fi
          tail -3 analyze.log
          exit $code
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -n -E "\[E\]|EXCEPTION|Exception|Expected|Actual|Error:|\.dart:[0-9]+" test.log | head -30 | cut -c1-300 | sed 's/%/%25/g' | while read -r l; do echo "::error title=test::$l"; done
          fi
          tail -3 test.log
          exit $code
      - name: Publish rendered previews
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/renders && cp test/renders/*.png /tmp/renders/
          cd /tmp/renders
          git init -q -b renders
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "Rendered previews for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" renders
      - name: Build release APK
        run: |
          set +e
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://sanjaal-api.onrender.com/api/v1' }} > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|FAILURE|What went wrong|Execution failed|Caused by|minSdk|Could not" -A2 build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3500 | while read -r l; do echo "::error title=APK build::$l"; done
          fi
          if [ $code -ne 0 ]; then tail -100 build.log; else tail -5 build.log; fi
          exit $code
      - name: Preserve app failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-failure-logs
          path: |
            app/analyze.log
            app/test.log
            app/build.log
          if-no-files-found: ignore
      - name: Fail closed - the user APK must carry no test endpoint, test token or tunnel
        run: |
          set -e
          expected_version=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          expected_code=$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)
          [ "$expected_code" -ge 2008 ]
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -x "$aapt"
          cd build/app/outputs/flutter-apk
          n=0
          for f in *.apk; do
            n=$((n+1))
            echo "checking $f"
            "$aapt" dump badging "$f" > /tmp/sanjaal-apk-version.txt
            grep -F "package: name='au.fintex.sanjaal' versionCode='$expected_code' versionName='$expected_version'" /tmp/sanjaal-apk-version.txt
            unzip -tq "$f"
            mkdir -p "/tmp/x/$f"
            unzip -qo "$f" -d "/tmp/x/$f"
            [ -f "/tmp/x/$f/AndroidManifest.xml" ] && [ -f "/tmp/x/$f/classes.dex" ] && find "/tmp/x/$f/lib" -name libapp.so | grep -q . || { echo "::error::incomplete apk $f"; exit 1; }
            if grep -raEl 'trycloudflare|local-e2e|10\.0\.2\.2|E2E_TOKEN' "/tmp/x/$f"; then echo "::error::test-only string found in $f"; exit 1; fi
            grep -qa 'sanjaal-api.onrender.com' -r "/tmp/x/$f/lib" || { echo "::error::expected API default not found in $f"; exit 1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no apk found"; exit 1; }
          echo "checked $n apk(s): clean"
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  # Private engineering artifact only. It has no signature, upload or release step.
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Build unsigned ARM64 engineering bundle
        env:
          SANJAAL_UNSIGNED_BUNDLE: '1'
        run: |
          flutter build appbundle --release --target-platform android-arm64 --obfuscate \
            --split-debug-info=build/bundle-debug-info \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://sanjaal-api.onrender.com/api/v1' }}
          python3 - <<'PY_BUNDLE'
          import zipfile
          from pathlib import Path
          p=Path('build/app/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert not any(n.upper().endswith(('.RSA','.DSA','.EC','.SF')) and n.upper().startswith('META-INF/') for n in names), 'AAB must be unsigned'
              assert {'BundleConfig.pb','base/manifest/AndroidManifest.xml','base/lib/arm64-v8a/libapp.so'}.issubset(names)
              libs=[n for n in names if n.startswith('base/lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('base/lib/arm64-v8a/') for n in libs), 'Incomplete extra ABI in ARM64 bundle'
              for n in names:
                  if not n.endswith('/'):
                      b=z.read(n)
                      assert not any(t in b for t in [b'trycloudflare',b'local-e2e',b'10.0.2.2',b'E2E_TOKEN']), 'Test-only marker: '+n
              assert b'https://sanjaal-api.onrender.com/api/v1' in z.read('base/lib/arm64-v8a/libapp.so')
          PY_BUNDLE
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-unsigned-aab-engineering-only
          path: |
            app/build/app/outputs/bundle/release/*.aab
            app/build/bundle-debug-info/
          retention-days: 7

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: app
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - name: Start local API with a synthetic member (isolated, no Auth0, no live data)
        working-directory: api
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
          APP_ENV: local
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/e2e/db.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -e
          composer install --no-interaction --prefer-dist --no-progress
          python3 tests/E2E/native_input_contract.py
          python3 tests/E2E/native_media_contract.py
          mkdir -p /tmp/e2e && touch /tmp/e2e/db.sqlite .env
          php artisan migrate --force
          php tests/E2E/prepare.php /tmp/e2e
          echo "::add-mask::$(cat /tmp/e2e/token.txt)"
          echo "::add-mask::$(cat /tmp/e2e/viewer-token.txt)"
          E2E_NATIVE_INPUT=1 E2E_JWKS_FILE=/tmp/e2e/jwks.json nohup php -S 0.0.0.0:8000 -t public tests/E2E/server.php > /tmp/e2e/server.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "unauthenticated /me status %{http_code}\n" http://127.0.0.1:8000/api/v1/auth/me -H 'Accept: application/json'
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/ci/emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: |
            app/build/screenshots/*.png
            app/build/screenshots/*.mp4
            app/build/screenshots/*.txt
            app/build/screenshots/*.xml
            /tmp/drive_*.log
          if-no-files-found: warn
      - name: Publish emulator screenshots
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/shots && cp app/build/screenshots/*.png app/build/screenshots/*.mp4 /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q -b emulator-shots
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git add . && git commit -qm "Emulator screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" emulator-shots

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2, resolved by verified run44011833694
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://sanjaal-api.onrender.com/api/v1' }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr sanjaal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-ios-unsigned
          path: app/sanjaal-unsigned.ipa

  # Publishing is deliberately closed until stable-key signing is integrated.
  # The ordinary app artifact is debug-signed even in release mode.
  # A tag alone must never ship it, or bypass genuine native-input checks.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && false
    needs: [api, app, ios, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          mkdir out
          cp sanjaal-apk/*.apk out/
          cp sanjaal-ios-unsigned/*.ipa out/
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Sanjaal ${GITHUB_REF_NAME#v}" \
            --notes "Android APKs per CPU type (arm64-v8a for most phones) and an unsigned iOS build that cannot be installed on a phone until it is signed. Check the SHA256SUMS.txt file." *
