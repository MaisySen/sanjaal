name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env && php artisan test
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: |
          set +e
          flutter build apk --release --split-per-abi --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://sanjaal-api.onrender.com/api/v1' }} > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|FAILURE|What went wrong|Execution failed|Caused by|minSdk|Could not" -A2 build.log | head -40 | tr '\n' ' ' | sed 's/%/%25/g' | cut -c1-3500 | while read -r l; do echo "::error title=APK build::$l"; done
          fi
          tail -5 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-apk
          path: app/build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://sanjaal-api.onrender.com/api/v1' }}
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr sanjaal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: sanjaal-ios-unsigned
          path: app/sanjaal-unsigned.ipa
