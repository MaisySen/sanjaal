name: Reviewed coherent candidate native validation
'on':
  push:
    branches:
    - coherent-native-validation
permissions:
  contents: read
concurrency:
  group: coherent-native-validation
  cancel-in-progress: false
jobs:
  android-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify frozen reviewed runtime and private fixture scope
      run: 'test "$(git rev-parse HEAD:app/lib)" = 3ec46b9aef42d5d322227f542bac319a2ba82d96

        test "$(git rev-parse HEAD:app/ios)" = 303290ef893d045f2a0fb143bd896e88ea9b55bd

        test "$(git rev-parse HEAD:app/android)" = a3f429356827215a6ddab042ea942e278e7e2a51

        test "$(git rev-parse HEAD:app/pubspec.yaml)" = 86e457493142bdf716804d12193e286efcc5ef5e

        test "$(git rev-parse HEAD:app/pubspec.lock)" = a14a12b7db208d079c3793bbffd41893a9883186

        '
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.50.0
        cache: true
    - name: Enable KVM
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm

        '
    - run: flutter pub get
      working-directory: app
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
        coverage: none
    - name: Start local API with a synthetic member (isolated, no Auth0, no live data)
      working-directory: api
      env:
        APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
        APP_ENV: local
        DB_CONNECTION: sqlite
        DB_DATABASE: /tmp/e2e/db.sqlite
        CACHE_STORE: file
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync
      run: 'set -e

        composer install --no-interaction --prefer-dist --no-progress

        python3 tests/E2E/native_input_contract.py

        python3 tests/E2E/native_media_contract.py

        mkdir -p /tmp/e2e && touch /tmp/e2e/db.sqlite .env

        php artisan migrate --force

        php tests/E2E/prepare.php /tmp/e2e

        echo "::add-mask::$(cat /tmp/e2e/token.txt)"

        echo "::add-mask::$(cat /tmp/e2e/viewer-token.txt)"

        E2E_NATIVE_INPUT=1 E2E_JWKS_FILE=/tmp/e2e/jwks.json nohup php -S 0.0.0.0:8000 -t public tests/E2E/server.php
        > /tmp/e2e/server.log 2>&1 &

        E2E_FAULT_AFTER_COMMIT=1 UPLOAD_INTENTS_ENABLED=true E2E_NATIVE_INPUT=1 E2E_JWKS_FILE=/tmp/e2e/jwks.json
        nohup php -S 0.0.0.0:8001 -t public tests/E2E/server.php > /tmp/e2e/server2.log 2>&1 &

        sleep 3

        curl -s -o /dev/null -w "unauthenticated /me status %{http_code}\n" http://127.0.0.1:8000/api/v1/auth/me
        -H ''Accept: application/json''

        '
    - name: Smoke test on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        script: env NATIVE_FLOW_TARGETS=upload_retry sh .github/ci/emulator.sh
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: emulator-screenshots
        path: 'app/build/screenshots/*.png

          app/build/screenshots/*.mp4

          app/build/screenshots/*.txt

          app/build/screenshots/*.xml

          /tmp/drive_*.log

          '
        if-no-files-found: warn
        retention-days: 1
  ios-flows:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify frozen reviewed runtime and private fixture scope
      run: 'test "$(git rev-parse HEAD:app/lib)" = 3ec46b9aef42d5d322227f542bac319a2ba82d96

        test "$(git rev-parse HEAD:app/ios)" = 303290ef893d045f2a0fb143bd896e88ea9b55bd

        test "$(git rev-parse HEAD:app/android)" = a3f429356827215a6ddab042ea942e278e7e2a51

        test "$(git rev-parse HEAD:app/pubspec.yaml)" = 86e457493142bdf716804d12193e286efcc5ef5e

        test "$(git rev-parse HEAD:app/pubspec.lock)" = a14a12b7db208d079c3793bbffd41893a9883186

        '
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.50.0
        cache: true
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring,pdo_sqlite,sqlite3,bcmath,gd
        coverage: none
    - name: Disposable local API, no production data or services
      working-directory: api
      env:
        APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
        APP_ENV: local
        DB_CONNECTION: sqlite
        DB_DATABASE: /tmp/ios-e2e/db.sqlite
        CACHE_STORE: file
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync
      run: 'composer install --no-interaction --prefer-dist --no-progress

        mkdir -p /tmp/ios-e2e;touch /tmp/ios-e2e/db.sqlite .env

        php artisan migrate --force

        php tests/E2E/prepare.php /tmp/ios-e2e

        cp ../app/test/fixtures/ios_synthetic_video.mp4 public/ios-native-fixture.mp4

        echo "::add-mask::$(cat /tmp/ios-e2e/token.txt)"

        E2E_FAULT_AFTER_COMMIT=1 UPLOAD_INTENTS_ENABLED=true E2E_JWKS_FILE=/tmp/ios-e2e/jwks.json nohup php -S 127.0.0.1:8000
        -t public tests/E2E/server.php > /tmp/ios-api.log 2>&1 &

        curl --retry 5 --retry-connrefused --retry-delay 1 -s http://localhost:8000/api/v1/auth/me -H ''Accept:
        application/json''

        '
    - name: Select and boot available iPhone simulator
      run: 'defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

        xcrun simctl list devices available --json > /tmp/ios-devices.json

        python3 - <<''PY''

        import json,os

        d=json.load(open(''/tmp/ios-devices.json''))

        eligible=[x for runtime,rows in d[''devices''].items() if ''iOS'' in runtime for x in rows if x[''isAvailable'']
        and ''iPhone'' in x[''name'']]

        assert eligible,''No installed iPhone simulator runtime''

        chosen=eligible[0]

        with open(os.environ[''GITHUB_ENV''],''a'') as f:f.write(''IOS_DEVICE=''+chosen[''udid'']+''\n'')

        print(chosen)

        PY

        '
    - name: Run actual iOS simulator application and native storage plugins
      working-directory: app
      run: "flutter pub get\nmkdir -p build/screenshots\nxcrun simctl boot \"$IOS_DEVICE\" || true\nxcrun simctl\
        \ bootstatus \"$IOS_DEVICE\" -b\nxcrun simctl io \"$IOS_DEVICE\" recordVideo build/screenshots/ios-flows.mp4\
        \ > /tmp/ios-record.log 2>&1 &\nREC=$!\n# Compile once, then launch explicitly. Do not depend on the failed\n\
        # Flutter simulator log-reader discovery path to find its VM service.\nflutter build ios --simulator --debug\
        \ --target=integration_test/ios_flows_test.dart --no-pub --dart-define=API_BASE_URL=http://localhost:8000/api/v1\
        \ --dart-define=E2E_TOKEN_BASE=http://localhost:8000 --dart-define=E2E_TOKEN=\"$(cat /tmp/ios-e2e/token.txt)\"\
        \ > ios-build.log 2>&1\nxcrun simctl install \"$IOS_DEVICE\" build/ios/iphonesimulator/Runner.app\n# Debug-only\
        \ simulator fixture, bind a fixed localhost port. Nothing\n# listens remotely and these arguments never\
        \ enter a release build.\nxcrun simctl launch --console \"$IOS_DEVICE\" au.fintex.sanjaal --vm-service-host=127.0.0.1\
        \ --vm-service-port=57321 --disable-service-auth-codes > ios-native-console.log 2>&1 &\nLAUNCH=$!\ntrap\
        \ 'kill -INT \"$REC\" 2>/dev/null || true; kill \"$LAUNCH\" 2>/dev/null || true' EXIT\nset +e\npython3 -\
        \ <<'PYDRIVE'\nimport os,subprocess,signal,time,json,urllib.request,pathlib\nendpoint='http://127.0.0.1:57321/'\n\
        deadline=time.monotonic()+90\nwhile True:\n  try:\n    with urllib.request.urlopen(endpoint+'getVM',timeout=2)\
        \ as response:\n      state=json.load(response)\n    assert state.get('result',{}).get('type')=='VM',state\n\
        \    pathlib.Path('ios-vm-probe.json').write_text(json.dumps(state,indent=2))\n    print('Direct simulator\
        \ VM service verified',flush=True)\n    break\n  except Exception as error:\n    if time.monotonic()>deadline:\n\
        \      print('Direct VM service unavailable within90s: '+str(error),flush=True)\n      subprocess.run(['xcrun','simctl','spawn',os.environ['IOS_DEVICE'],'launchctl','list'])\n\
        \      raise SystemExit(125)\n    time.sleep(1)\nimport threading\nstop=threading.Event()\ndef native_evidence():\n\
        \  seen=set()\n  while not stop.wait(0.4):\n    result=subprocess.run(['xcrun','simctl','get_app_container',os.environ['IOS_DEVICE'],'au.fintex.sanjaal','data'],capture_output=True,text=True)\n\
        \    if result.returncode:continue\n    container=pathlib.Path(result.stdout.strip())\n    for pending in\
        \ container.rglob('*.native-pending'):\n      if str(pending) in seen:continue\n      seen.add(str(pending))\n\
        \      name=pending.stem\n      subprocess.run(['xcrun','simctl','io',os.environ['IOS_DEVICE'],'screenshot','build/screenshots/native_'+name+'.png'],check=True)\n\
        \      pending.with_suffix('.native-done').write_text('captured')\nmonitor=threading.Thread(target=native_evidence,daemon=True);monitor.start()\n\
        args=['flutter','drive','-d',os.environ['IOS_DEVICE'],'--driver=test_driver/integration_test.dart','--use-existing-app='+endpoint,'--no-pub']\n\
        with open('ios-driver-output.log','w') as log:\n  child=subprocess.Popen(args,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)\n\
        \  try:code=child.wait(timeout=600)\n  except subprocess.TimeoutExpired:\n    print('Existing-app iOS driver\
        \ exceeded10-minute diagnostic bound',flush=True)\n    subprocess.run(['xcrun','simctl','io',os.environ['IOS_DEVICE'],'screenshot','build/screenshots/ios-timeout-native.png'])\n\
        \    os.killpg(child.pid,signal.SIGTERM)\n    try:child.wait(timeout=15)\n    except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL)\n\
        \    code=124\nstop.set();monitor.join(timeout=5)\npathlib.Path('ios-driver-exit.txt').write_text(str(code))\n\
        raise SystemExit(code)\nPYDRIVE\nRC=$?\nkill -INT \"$REC\";wait \"$REC\"\nxcrun simctl io \"$IOS_DEVICE\"\
        \ screenshot build/screenshots/ios-final-native.png\ntail -80 ios-driver-output.log\nexit \"$RC\"\n"
    - name: Preserve native diagnostic state even after a drive failure
      if: always()
      working-directory: app
      run: "mkdir -p build/screenshots\nif [ -n \"$IOS_DEVICE\" ]; then\n  xcrun simctl io \"$IOS_DEVICE\" screenshot\
        \ build/screenshots/ios-diagnostic-native.png || true\n  CONTAINER=$(xcrun simctl get_app_container \"$IOS_DEVICE\"\
        \ au.fintex.sanjaal data 2>/dev/null || true)\n  if [ -n \"$CONTAINER\" ]; then\n    find \"$CONTAINER\"\
        \ -name ios-stages.log -exec cp {} build/screenshots/ios-stages.log \\; || true\n    find \"$CONTAINER\"\
        \ -type d -name ios-evidence -exec cp -R {} build/screenshots/ \\; || true\n  fi\nfi\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ios-simulator-local-evidence
        path: 'app/ios-driver-output.log

          app/ios-simulator.log

          app/ios-build.log

          app/ios-native-console.log

          app/ios-vm-probe.json

          app/ios-driver-exit.txt

          app/build/screenshots/*

          /tmp/ios-api.log

          /tmp/ios-devices.json

          '
        retention-days: 1
    permissions:
      contents: read
