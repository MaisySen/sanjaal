name: Reviewed candidate API verification only
'on':
  push:
    branches:
    - coherent-native-validation
permissions:
  contents: read
concurrency:
  group: coherent-native-validation
  cancel-in-progress: false
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        env:
          POSTGRES_USER: sanjaal
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: sanjaal_test
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U sanjaal -d sanjaal_test" --health-interval 5s --health-timeout 5s --health-retries
          10
    defaults:
      run:
        working-directory: api
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 4ccd751ff585271f1dede4b3a4ddd4d559e60ae6
        persist-credentials: false
    - name: Verify frozen candidate API dependency and platform identity
      working-directory: .
      run: 'test "$(git rev-parse HEAD:api)" = f8da760fa1c6513548f1479ca5b6c4c6db527b5d

        test "$(git rev-parse HEAD:app/lib)" = 6e640f7d0df2c211efa6c00b8dcf4de2ab2f2901

        git rev-parse HEAD HEAD:api HEAD:app/lib HEAD:app/android HEAD:app/ios HEAD:app/pubspec.lock HEAD:api/composer.lock

        git diff --exit-code'
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, bcmath, gd
        coverage: none
    - run: composer install --no-interaction --prefer-dist --no-progress
    - run: 'set -euo pipefail

        {

        touch .env && php artisan test

        } 2>&1 | tee /tmp/candidate-api-1.log'
      env:
        APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
    - run: 'set -euo pipefail

        {

        touch .env

        php artisan route:cache && php artisan event:cache

        php artisan test

        php artisan route:clear && php artisan event:clear


        } 2>&1 | tee /tmp/candidate-api-2.log'
      env:
        APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
    - name: PostgreSQL 18 API and concurrent invariant checks (throwaway service only)
      run: 'set -euo pipefail

        {

        php artisan test

        php artisan route:cache && php artisan event:cache

        php artisan test

        php artisan route:clear && php artisan event:clear

        PG_RACE=1 php artisan test tests/Concurrency


        } 2>&1 | tee /tmp/candidate-api-3.log'
      env:
        APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: sanjaal_test
        DB_USERNAME: sanjaal
        DB_PASSWORD: local-fixture-only
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: exact-candidate-api-verification
        path: /tmp/candidate-api-*.log
        retention-days: 3
    timeout-minutes: 30
