name: Reviewed coherent candidate native validation
'on':
  push:
    branches:
    - coherent-native-validation
    - reviewed-coherent-product
    - reviewed-report-native
    paths:
    - app/**
    - api/**
    - .github/workflows/coherent-native-validation.yml
    - .github/ci/native-*
    - .github/ci/test-native-*
permissions:
  contents: read
concurrency:
  group: coherent-native-validation
  cancel-in-progress: false
jobs:
  ios-flows:
    if: github.repository == 'MaisySen/sanjaal' && github.event.repository.private == false
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify frozen reviewed runtime and private fixture scope
      run: |
        test "$(git rev-parse HEAD:app/lib)" = 102bf21080214f091957183eaaa6c7960427d991
        test "$(git rev-parse HEAD:app/ios)" = ad3103d5f6f5916be739d7834990aeaa41a29ec1
        test "$(git rev-parse HEAD:app/android)" = d211060d2a948c718cd9d422b4bc9161c6d2b49d
        test "$(git rev-parse HEAD:app/pubspec.yaml)" = 5a697f2f5a49a12b7927174ff91f5c842ec4e2fc
        test "$(git rev-parse HEAD:app/pubspec.lock)" = d6f2d80db0abcd8fc53cbdf001fd8bac9d476eec
        test "$(git rev-parse HEAD:app/integration_test)" = 18d876a212192b2775119e0cd3dcf65e0789b229
        test "$(git rev-parse HEAD:api/app)" = 90754418bd97b2725efa2598417b294fad5f284a
        test "$(git rev-parse HEAD:api/config)" = 14692b362a6c58d1eca3fb14ab254da3b69bdefa
        test "$(git rev-parse HEAD:api/routes)" = 519700d6eff4a62ba2b209d9bea24638f8f1ebaa
        test "$(git rev-parse HEAD:api/database/migrations)" = ea929ecc8dc6730b4c6f2044a1f32a60a59ad04d
        test "$(git rev-parse HEAD:api/tests/E2E)" = 89ca47b063340ad09cb942aac2537578bc17b254
    - name: Verify pinned simulator validation host and toolchain
      run: |
        set -euo pipefail
        python3 - <<'HOST'
        import platform,subprocess
        assert platform.mac_ver()[0].split('.')[0]=='15',platform.mac_ver()
        assert platform.machine()=='arm64',platform.machine()
        xcode=subprocess.check_output(['xcodebuild','-version'],text=True).strip()
        assert xcode=='Xcode 26.3\nBuild version 17C529',xcode
        sdk=subprocess.check_output(['xcrun','--sdk','iphonesimulator','--show-sdk-version'],text=True).strip()
        assert sdk=='26.2',sdk
        print('Verified macOS15 arm64, '+xcode.replace('\n',', ')+', simulator SDK '+sdk,flush=True)
        HOST
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.50.0
        cache: false
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring,pdo_sqlite,sqlite3,bcmath,gd
        coverage: none
    - name: Disposable local API, no production data or services
      working-directory: api
      env:
        APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
        APP_ENV: local
        DB_CONNECTION: sqlite
        DB_DATABASE: /tmp/ios-e2e/db.sqlite
        CACHE_STORE: file
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync
      run: |
        composer install --no-interaction --prefer-dist --no-progress
        mkdir -p /tmp/ios-e2e;touch /tmp/ios-e2e/db.sqlite .env
        php artisan migrate --force
        php tests/E2E/prepare.php /tmp/ios-e2e
        cp ../app/test/fixtures/ios_synthetic_video.mp4 public/ios-native-fixture.mp4
        echo "::add-mask::$(cat /tmp/ios-e2e/token.txt)"
        E2E_FAULT_AFTER_COMMIT=1 UPLOAD_INTENTS_ENABLED=true GROUP_OWNERSHIP_ENABLED=true GROUP_MEMBER_REMOVAL_ENABLED=true E2E_JWKS_FILE=/tmp/ios-e2e/jwks.json nohup php -S 127.0.0.1:8000 -t public tests/E2E/server.php > /tmp/ios-api.log 2>&1 &
        curl --retry 5 --retry-connrefused --retry-delay 1 -s http://localhost:8000/api/v1/auth/me -H 'Accept: application/json'

        python3 ../.github/ci/native-bind-probe.py
        python3 ../.github/ci/native-socket-proxy-contract.py
        nohup python3 ../.github/ci/native-socket-proxy.py --port 8002 --upstream http://127.0.0.1:8000 --token-file /tmp/ios-e2e/token.txt > /tmp/ios-socket-gate.log 2>&1 &
        GATE_PID=$!
        python3 ../.github/ci/native-socket-proxy-ready.py /tmp/ios-e2e/token.txt || {
          ps -p "$GATE_PID" -o pid,ppid,state,etime,comm || true
          lsof -nP -iTCP:8002 -sTCP:LISTEN || true
          cat /tmp/ios-socket-gate.log
          exit 1
        }
        python3 ../.github/ci/test-native-group-search-preflight.py
        python3 ../.github/ci/native-group-search-preflight.py
        python3 ../.github/ci/test-native-screenshot-monitor.py
    - name: Select and boot available iPhone simulator
      run: |
        defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
        xcrun simctl list devices available --json > /tmp/ios-devices.json
        python3 - <<'PY'
        import json,os
        d=json.load(open('/tmp/ios-devices.json'))
        eligible=[x for runtime,rows in d['devices'].items() if runtime=='com.apple.CoreSimulator.SimRuntime.iOS-26-2' for x in rows if x['isAvailable'] and x['name']=='iPhone 17 Pro']
        assert eligible,'Pinned iOS26.2 iPhone17Pro simulator is unavailable'
        chosen=eligible[0]
        with open(os.environ['GITHUB_ENV'],'a') as f:f.write('IOS_DEVICE='+chosen['udid']+'\n')
        print(chosen)
        PY
    - name: Run actual iOS simulator application and native storage plugins
      working-directory: app
      run: |
        flutter pub get
        mkdir -p build/screenshots
        xcrun simctl boot "$IOS_DEVICE" || true
        xcrun simctl bootstatus "$IOS_DEVICE" -b
        # Simulator-only first-keyboard setup. Never changes the shipped app or a phone.
        # Appium documents this domain/key; actual keyboard pixels still need inspection.
        xcrun simctl spawn "$IOS_DEVICE" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
        xcrun simctl spawn "$IOS_DEVICE" defaults read com.apple.keyboard.preferences DidShowContinuousPathIntroduction
        df -h .
        # Compile once, then launch explicitly. Do not depend on the failed
        # Flutter simulator log-reader discovery path to find its VM service.
        flutter build ios --simulator --debug --target=integration_test/ios_flows_test.dart --no-pub --dart-define=API_BASE_URL=http://localhost:8002/api/v1 --dart-define=E2E_TOKEN_BASE=http://localhost:8002 --dart-define=E2E_TOKEN="$(cat /tmp/ios-e2e/token.txt)" > ios-build.log 2>&1
        xcrun simctl install "$IOS_DEVICE" build/ios/iphonesimulator/Runner.app
        # One installed binary. The first process exercises the complete journey,
        # the second restores the unresolved report from actual native storage.
        python3 ../.github/ci/test-native-report-restart-driver.py
        python3 ../.github/ci/native-report-restart-driver.py
    - name: Preserve native diagnostic state even after a drive failure
      if: always()
      working-directory: app
      run: |
        mkdir -p build/screenshots
        if [ -n "$IOS_DEVICE" ]; then
          xcrun simctl io "$IOS_DEVICE" screenshot build/screenshots/ios-diagnostic-native.png || true
          CONTAINER=$(xcrun simctl get_app_container "$IOS_DEVICE" au.fintex.sanjaal data 2>/dev/null || true)
          if [ -n "$CONTAINER" ]; then
            find "$CONTAINER" -name ios-stages.log -exec cp {} build/screenshots/ios-stages.log \; || true
            find "$CONTAINER" -type d -name ios-evidence -exec cp -R {} build/screenshots/ \; || true
          fi
        fi
    - name: Preserve bounded synthetic native pixels without artifact storage
      if: always()
      run: |
        python3 .github/ci/test-native-diagnostics.py
        python3 .github/ci/native-diagnostics.py app
        python3 .github/ci/test-native-pixel-log.py
        python3 .github/ci/native-pixel-log.py
    permissions:
      contents: read
