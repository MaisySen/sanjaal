name: Reviewed coherent candidate native validation
'on':
  push:
    branches:
    - coherent-native-validation
    - reviewed-coherent-product
    paths:
    - app/**
    - api/**
    - .github/workflows/coherent-native-validation.yml
    - .github/ci/native-*
    - .github/ci/test-native-*
permissions:
  contents: read
concurrency:
  group: coherent-native-validation
  cancel-in-progress: false
jobs:
  ios-flows:
    if: github.repository == 'MaisySen/sanjaal' && github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Verify frozen reviewed runtime and private fixture scope
      run: |
        test "$(git rev-parse HEAD:app/lib)" = cc9b261b25956923a1d8c4e0fde25d9780de5aeb
        test "$(git rev-parse HEAD:app/ios)" = ad3103d5f6f5916be739d7834990aeaa41a29ec1
        test "$(git rev-parse HEAD:app/android)" = d211060d2a948c718cd9d422b4bc9161c6d2b49d
        test "$(git rev-parse HEAD:app/pubspec.yaml)" = a70859c72405a0d40b8b3441010fcf6d8676e7a9
        test "$(git rev-parse HEAD:app/pubspec.lock)" = a14a12b7db208d079c3793bbffd41893a9883186
        test "$(git rev-parse HEAD:app/integration_test)" = 9ec5f3b9bf3ad8d20de1196db6b4345151d73ad5
        test "$(git rev-parse HEAD:api/app)" = 2fc600e01e4a11b437f333379caac203c218caa0
        test "$(git rev-parse HEAD:api/config)" = 14692b362a6c58d1eca3fb14ab254da3b69bdefa
        test "$(git rev-parse HEAD:api/routes)" = 519700d6eff4a62ba2b209d9bea24638f8f1ebaa
        test "$(git rev-parse HEAD:api/database/migrations)" = ed4ebbe416b37335335a0b27b0185a8310c456b7
        test "$(git rev-parse HEAD:api/tests/E2E)" = 03f14165fab2b02f48b0d1efc5e2b4899f8c6aec
    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: 3.50.0
        cache: false
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring,pdo_sqlite,sqlite3,bcmath,gd
        coverage: none
    - name: Disposable local API, no production data or services
      working-directory: api
      env:
        APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
        APP_ENV: local
        DB_CONNECTION: sqlite
        DB_DATABASE: /tmp/ios-e2e/db.sqlite
        CACHE_STORE: file
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync
      run: |
        composer install --no-interaction --prefer-dist --no-progress
        mkdir -p /tmp/ios-e2e;touch /tmp/ios-e2e/db.sqlite .env
        php artisan migrate --force
        php tests/E2E/prepare.php /tmp/ios-e2e
        cp ../app/test/fixtures/ios_synthetic_video.mp4 public/ios-native-fixture.mp4
        echo "::add-mask::$(cat /tmp/ios-e2e/token.txt)"
        E2E_FAULT_AFTER_COMMIT=1 UPLOAD_INTENTS_ENABLED=true GROUP_OWNERSHIP_ENABLED=true GROUP_MEMBER_REMOVAL_ENABLED=true E2E_JWKS_FILE=/tmp/ios-e2e/jwks.json nohup php -S 127.0.0.1:8000 -t public tests/E2E/server.php > /tmp/ios-api.log 2>&1 &
        curl --retry 5 --retry-connrefused --retry-delay 1 -s http://localhost:8000/api/v1/auth/me -H 'Accept: application/json'

        python3 ../.github/ci/native-bind-probe.py
        python3 ../.github/ci/native-socket-proxy-contract.py
        nohup python3 ../.github/ci/native-socket-proxy.py --port 8002 --upstream http://127.0.0.1:8000 --token-file /tmp/ios-e2e/token.txt > /tmp/ios-socket-gate.log 2>&1 &
        GATE_PID=$!
        python3 ../.github/ci/native-socket-proxy-ready.py /tmp/ios-e2e/token.txt || {
          ps -p "$GATE_PID" -o pid,ppid,state,etime,comm || true
          lsof -nP -iTCP:8002 -sTCP:LISTEN || true
          cat /tmp/ios-socket-gate.log
          exit 1
        }
    - name: Select and boot available iPhone simulator
      run: |
        defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
        xcrun simctl list devices available --json > /tmp/ios-devices.json
        python3 - <<'PY'
        import json,os
        d=json.load(open('/tmp/ios-devices.json'))
        eligible=[x for runtime,rows in d['devices'].items() if 'iOS' in runtime for x in rows if x['isAvailable'] and 'iPhone' in x['name']]
        assert eligible,'No installed iPhone simulator runtime'
        chosen=eligible[0]
        with open(os.environ['GITHUB_ENV'],'a') as f:f.write('IOS_DEVICE='+chosen['udid']+'\n')
        print(chosen)
        PY
    - name: Run actual iOS simulator application and native storage plugins
      working-directory: app
      run: |
        flutter pub get
        mkdir -p build/screenshots
        xcrun simctl boot "$IOS_DEVICE" || true
        xcrun simctl bootstatus "$IOS_DEVICE" -b
        # Simulator-only first-keyboard setup. Never changes the shipped app or a phone.
        # Appium documents this domain/key; actual keyboard pixels still need inspection.
        xcrun simctl spawn "$IOS_DEVICE" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
        xcrun simctl spawn "$IOS_DEVICE" defaults read com.apple.keyboard.preferences DidShowContinuousPathIntroduction
        df -h .
        # Compile once, then launch explicitly. Do not depend on the failed
        # Flutter simulator log-reader discovery path to find its VM service.
        flutter build ios --simulator --debug --target=integration_test/ios_flows_test.dart --no-pub --dart-define=API_BASE_URL=http://localhost:8002/api/v1 --dart-define=E2E_TOKEN_BASE=http://localhost:8002 --dart-define=E2E_TOKEN="$(cat /tmp/ios-e2e/token.txt)" > ios-build.log 2>&1
        xcrun simctl install "$IOS_DEVICE" build/ios/iphonesimulator/Runner.app
        # Debug-only simulator fixture, bind a fixed localhost port. Nothing
        # listens remotely and these arguments never enter a release build.
        xcrun simctl launch --console "$IOS_DEVICE" au.fintex.sanjaal --vm-service-host=127.0.0.1 --vm-service-port=57321 --disable-service-auth-codes > ios-native-console.log 2>&1 &
        LAUNCH=$!
        trap 'kill "$LAUNCH" 2>/dev/null || true' EXIT
        set +e
        python3 - <<'PYDRIVE'
        import os,subprocess,signal,time,json,urllib.request,pathlib
        endpoint='http://127.0.0.1:57321/'
        deadline=time.monotonic()+90
        while True:
          try:
            with urllib.request.urlopen(endpoint+'getVM',timeout=2) as response:
              state=json.load(response)
            assert state.get('result',{}).get('type')=='VM',state
            pathlib.Path('ios-vm-probe.json').write_text(json.dumps(state,indent=2))
            print('Direct simulator VM service verified',flush=True)
            break
          except Exception as error:
            if time.monotonic()>deadline:
              print('Direct VM service unavailable within90s: '+str(error),flush=True)
              subprocess.run(['xcrun','simctl','spawn',os.environ['IOS_DEVICE'],'launchctl','list'])
              raise SystemExit(125)
            time.sleep(1)
        import threading
        stop=threading.Event()
        def native_evidence():
          seen=set()
          while not stop.wait(0.4):
            result=subprocess.run(['xcrun','simctl','get_app_container',os.environ['IOS_DEVICE'],'au.fintex.sanjaal','data'],capture_output=True,text=True)
            if result.returncode:continue
            container=pathlib.Path(result.stdout.strip())
            for pending in container.rglob('*.native-pending'):
              if str(pending) in seen:continue
              seen.add(str(pending))
              name=pending.stem
              subprocess.run(['xcrun','simctl','io',os.environ['IOS_DEVICE'],'screenshot','build/screenshots/native_'+name+'.png'],check=True)
              pending.with_suffix('.native-done').write_text('captured')
        monitor=threading.Thread(target=native_evidence,daemon=True);monitor.start()
        args=['flutter','drive','-d',os.environ['IOS_DEVICE'],'--driver=test_driver/integration_test.dart','--use-existing-app='+endpoint,'--no-pub']
        with open('ios-driver-output.log','w') as log:
          child=subprocess.Popen(args,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          try:code=child.wait(timeout=600)
          except subprocess.TimeoutExpired:
            print('Existing-app iOS driver exceeded10-minute diagnostic bound',flush=True)
            subprocess.run(['xcrun','simctl','io',os.environ['IOS_DEVICE'],'screenshot','build/screenshots/ios-timeout-native.png'])
            os.killpg(child.pid,signal.SIGTERM)
            try:child.wait(timeout=15)
            except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL)
            code=124
        stop.set();monitor.join(timeout=5)
        pathlib.Path('ios-driver-exit.txt').write_text(str(code))
        raise SystemExit(code)
        PYDRIVE
        RC=$?
        xcrun simctl io "$IOS_DEVICE" screenshot build/screenshots/ios-final-native.png || true
        cat ios-driver-exit.txt
        df -h .
        exit "$RC"
    - name: Preserve native diagnostic state even after a drive failure
      if: always()
      working-directory: app
      run: |
        mkdir -p build/screenshots
        if [ -n "$IOS_DEVICE" ]; then
          xcrun simctl io "$IOS_DEVICE" screenshot build/screenshots/ios-diagnostic-native.png || true
          CONTAINER=$(xcrun simctl get_app_container "$IOS_DEVICE" au.fintex.sanjaal data 2>/dev/null || true)
          if [ -n "$CONTAINER" ]; then
            find "$CONTAINER" -name ios-stages.log -exec cp {} build/screenshots/ios-stages.log \; || true
            find "$CONTAINER" -type d -name ios-evidence -exec cp -R {} build/screenshots/ \; || true
          fi
        fi
    - name: Preserve bounded synthetic native pixels without artifact storage
      if: always()
      run: |
        python3 .github/ci/test-native-diagnostics.py
        python3 .github/ci/native-diagnostics.py app
        python3 .github/ci/test-native-pixel-log.py
        python3 .github/ci/native-pixel-log.py
    permissions:
      contents: read
