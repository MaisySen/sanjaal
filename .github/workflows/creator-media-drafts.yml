name: Group draft preservation
on:
  push:
    branches: [group-draft-preservation]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format lib/group_draft_store.dart test/group_drafts_test.dart
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: timeout --kill-after=15s 180 flutter test test/group_drafts_test.dart test/new_chat_journey_test.dart test/chat_screen_session_test.dart --reporter expanded > media-draft.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-draft-evidence
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/session_bound_state.dart
            app/lib/call_page.dart
            app/lib/calls_page.dart
            app/lib/rooms_page.dart
            app/lib/gifts.dart
            app/test/realtime_session_test.dart
            app/test/renders/*.png
          retention-days: 7

  api-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env && php artisan test > api-tests.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-draft-api-evidence
          path: api/api-tests.log
          retention-days: 7
