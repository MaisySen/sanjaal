name: Chat screen session ownership
on:
  push:
    branches: [chat-screen-session-ownership]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format lib/chat_pages.dart test/chat_screen_session_test.dart
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: timeout --kill-after=15s 180 flutter test test/chat_screen_session_test.dart test/new_chat_journey_test.dart test/chat_retry_test.dart test/chat_media_retry_test.dart test/creator_media_draft_widgets_test.dart --reporter expanded > media-draft.log 2>&1
      - name: Session guard negative control
        run: |
          cp lib/chat_pages.dart /tmp/chat-pages-protected.dart
          trap 'cp /tmp/chat-pages-protected.dart lib/chat_pages.dart' EXIT
          python3 - <<'PYCONTROL'
          import pathlib,re
          p=pathlib.Path('lib/chat_pages.dart');s=p.read_text();start=s.index('class _ChatPageState')
          before=s[:start];after,n=re.subn(r'bool get _active\s*=>.*?;', 'bool get _active => true;', s[start:],count=1,flags=re.S)
          assert n==1
          p.write_text(before+after)
          PYCONTROL
          set +e
          timeout --kill-after=10s 90 flutter test test/chat_screen_session_test.dart --plain-name 'chat rejects late private content after same-member login' --reporter expanded > chat-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'another signed-in' chat-negative.log
          cp /tmp/chat-pages-protected.dart lib/chat_pages.dart
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-session-evidence
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/chat_pages.dart
            app/test/chat_screen_session_test.dart
            app/test/renders/*.png
          retention-days: 7
