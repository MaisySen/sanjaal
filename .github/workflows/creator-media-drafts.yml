name: Realtime session ownership
on:
  push:
    branches: [product-integrated-overnight]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format lib/session_bound_state.dart lib/call_page.dart lib/calls_page.dart lib/rooms_page.dart lib/gifts.dart test/realtime_session_test.dart
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: timeout --kill-after=15s 180 flutter test test/group_drafts_test.dart test/new_chat_journey_test.dart test/chat_screen_session_test.dart test/story_session_test.dart test/media_visibility_test.dart test/story_audience_test.dart test/nonblocking_story_handoff_test.dart test/registration_session_test.dart test/session_restore_test.dart test/signout_boundary_test.dart test/realtime_session_test.dart test/call_lifecycle_test.dart test/room_lifecycle_test.dart test/room_microphone_test.dart --reporter expanded > media-draft.log 2>&1
      - name: Login invalidation negative control
        run: |
          cp lib/api.dart /tmp/api-session-protected.dart
          trap 'cp /tmp/api-session-protected.dart lib/api.dart' EXIT
          python3 - <<'PYCONTROL'
          import pathlib
          p=pathlib.Path('lib/api.dart');s=p.read_text();start=s.index('  Future<void> login(String id, String password)')
          before=s[:start];after=s[start:];target='    notifyListeners();'
          assert target in after
          after=after.replace(target,'',1);p.write_text(before+after)
          PYCONTROL
          set +e
          timeout --kill-after=10s 90 flutter test test/realtime_session_test.dart --plain-name 'pending failed replacement login immediately retires capture ownership' --reporter expanded > realtime-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'close' realtime-negative.log
          cp /tmp/api-session-protected.dart lib/api.dart
      - name: Registration continuation negative control
        run: |
          cp lib/api.dart /tmp/api-register-protected.dart
          trap 'cp /tmp/api-register-protected.dart lib/api.dart' EXIT
          python3 - <<'PYCONTROL'
          import pathlib
          p=pathlib.Path('lib/api.dart');s=p.read_text();start=s.index('  Future<void> register(');end=s.index('  Future<void> _loadMe()',start)
          before=s[:start];target=s[start:end];assert '_checkSession(epoch);' in target
          target=target.replace('_checkSession(epoch);','',1)
          p.write_text(before+target+s[end:])
          PYCONTROL
          set +e
          timeout --kill-after=10s 90 flutter test test/registration_session_test.dart --plain-name 'late signup 200 cannot replace other member login' --reporter expanded > registration-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' registration-negative.log
          cp /tmp/api-register-protected.dart lib/api.dart
      - name: Story ownership negative control
        run: |
          cp lib/session_bound_state.dart /tmp/story-session-protected.dart
          trap 'cp /tmp/story-session-protected.dart lib/session_bound_state.dart' EXIT
          python3 - <<'PYSTORY'
          from pathlib import Path
          p=Path('lib/session_bound_state.dart');s=p.read_text();start=s.index('  bool get sessionActive =>');end=s.index('  @override',start)
          s=s[:start]+'  bool get sessionActive => true;\n'+s[end:];p.write_text(s)
          PYSTORY
          set +e
          timeout --kill-after=10s 90 flutter test test/story_session_test.dart --plain-name 'viewer stops at delayed headers on other login' --reporter expanded > story-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' story-negative.log
          cp /tmp/story-session-protected.dart lib/session_bound_state.dart
      - name: Saved member capability negative control
        run: |
          cp lib/chat_pages.dart /tmp/group-plan-protected.dart
          trap 'cp /tmp/group-plan-protected.dart lib/chat_pages.dart' EXIT
          python3 - <<'PYGROUP'
          from pathlib import Path
          p=Path('lib/chat_pages.dart');s=p.read_text();needle='if(!widget.session.groupMemberRefsEnabled)throw const _GroupDraftServerNotReady();';assert needle in s;s=s.replace(needle,'',1);p.write_text(s)
          PYGROUP
          set +e
          timeout --kill-after=10s 90 flutter test test/group_drafts_test.dart --plain-name 'capability-off refuses saved group creation without any POST' --reporter expanded > group-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' group-negative.log
          cp /tmp/group-plan-protected.dart lib/chat_pages.dart
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: realtime-session-evidence
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/group_draft_store.dart
            app/test/group_drafts_test.dart
            app/lib/session_bound_state.dart
            app/lib/call_page.dart
            app/lib/calls_page.dart
            app/lib/rooms_page.dart
            app/lib/gifts.dart
            app/test/realtime_session_test.dart
            app/test/renders/*.png
          retention-days: 7
