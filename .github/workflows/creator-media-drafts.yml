name: Creator media draft implementation
on:
  push:
    branches: [creator-media-draft-preservation]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format lib/creator_media_draft_store.dart test/creator_media_drafts_test.dart test/creator_media_draft_widgets_test.dart
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: flutter test test/creator_media_drafts_test.dart test/creator_media_draft_widgets_test.dart --reporter expanded > media-draft.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-media-draft-evidence
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/creator_media_draft_store.dart
            app/test/creator_media_drafts_test.dart
            app/test/renders/*.png
          retention-days: 7
