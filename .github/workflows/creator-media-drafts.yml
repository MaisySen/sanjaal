name: Chat screen session ownership
on:
  push:
    branches: [chat-screen-session-ownership]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format lib/chat_pages.dart test/chat_screen_session_test.dart
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: timeout --kill-after=15s 180 flutter test test/chat_screen_session_test.dart test/new_chat_journey_test.dart test/chat_retry_test.dart test/chat_media_retry_test.dart --reporter expanded > media-draft.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-session-evidence
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/chat_pages.dart
            app/test/chat_screen_session_test.dart
            app/test/renders/*.png
          retention-days: 7
