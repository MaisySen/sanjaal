name: Registration session ownership
on:
  push:
    branches: [registration-session-ownership]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format test/registration_session_test.dart
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: timeout --kill-after=15s 180 flutter test test/registration_session_test.dart test/session_restore_test.dart test/signout_boundary_test.dart --reporter expanded > media-draft.log 2>&1
      - name: Registration continuation negative control
        run: |
          cp lib/api.dart /tmp/api-register-protected.dart
          trap 'cp /tmp/api-register-protected.dart lib/api.dart' EXIT
          python3 - <<'PYCONTROL'
          import pathlib
          p=pathlib.Path('lib/api.dart');s=p.read_text();start=s.index('  Future<void> register(');end=s.index('  Future<void> _loadMe()',start)
          before=s[:start];target=s[start:end];assert '_checkSession(epoch);' in target
          target=target.replace('_checkSession(epoch);','',1)
          p.write_text(before+target+s[end:])
          PYCONTROL
          set +e
          timeout --kill-after=10s 90 flutter test test/registration_session_test.dart --plain-name 'late signup 200 cannot replace other member login' --reporter expanded > registration-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' registration-negative.log
          cp /tmp/api-register-protected.dart lib/api.dart
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registration-session-evidence
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/api.dart
            app/lib/call_page.dart
            app/lib/calls_page.dart
            app/lib/rooms_page.dart
            app/lib/gifts.dart
            app/test/registration_session_test.dart
            app/test/renders/*.png
          retention-days: 7
