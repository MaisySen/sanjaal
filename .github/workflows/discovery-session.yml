name: Discovery session ownership
on:
  push:
    branches: [discovery-session-ownership]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: flutter test test/discovery_session_test.dart test/discovery_journey_test.dart --reporter expanded > focused.log 2>&1
      - name: Historical queued search negative control
        run: |
          cp lib/search_page.dart /tmp/search-protected.dart
          trap 'cp /tmp/search-protected.dart lib/search_page.dart' EXIT
          git show 8a34d9278f04e3ca0dcac498741952c8086bb337:app/lib/search_page.dart > lib/search_page.dart
          set +e
          timeout --kill-after=10s 90 flutter test test/discovery_session_test.dart --plain-name 'search cancels queued debounce before other member login' --reporter expanded > negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' negative.log
          cp /tmp/search-protected.dart lib/search_page.dart
      - run: flutter test test/discovery_session_test.dart test/discovery_journey_test.dart --reporter expanded > restored.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - run: flutter build apk --debug > build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-session-evidence
          path: |
            app/*.log
            app/test/renders/search_*.png
          retention-days: 7
