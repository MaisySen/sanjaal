name: Isolated experience behavior fixtures
on:
  push:
    branches: ['experience-journey-batch']
permissions:
  contents: read
jobs:
  api-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: api
    env:
      APP_ENV: testing
      APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      MAIL_MAILER: array
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-plugins
      - name: Synthetic SQLite call and existing regression fixtures
        run: |
          touch .env
          php artisan test
          php artisan route:cache
          php artisan event:cache
          php artisan test tests/Feature/CallReconciliationTest.php
