name: Android saved group UI recovery
on:
  push:
    branches: [group-draft-android-save-recovery]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format lib/group_draft_store.dart test/group_drafts_test.dart
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: timeout --kill-after=15s 180 flutter test test/group_drafts_test.dart test/new_chat_journey_test.dart test/chat_screen_session_test.dart --reporter expanded > media-draft.log 2>&1
      - name: Saved member capability negative control
        run: |
          cp lib/chat_pages.dart /tmp/group-plan-protected.dart
          trap 'cp /tmp/group-plan-protected.dart lib/chat_pages.dart' EXIT
          python3 - <<'PYGROUP'
          from pathlib import Path
          p=Path('lib/chat_pages.dart');s=p.read_text();needle='if(!widget.session.groupMemberRefsEnabled)throw const _GroupDraftServerNotReady();';assert needle in s;s=s.replace(needle,'',1);p.write_text(s)
          PYGROUP
          set +e
          timeout --kill-after=10s 90 flutter test test/group_drafts_test.dart --plain-name 'capability-off refuses saved group creation without any POST' --reporter expanded > group-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' group-negative.log
          cp /tmp/group-plan-protected.dart lib/chat_pages.dart
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-draft-evidence
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/session_bound_state.dart
            app/lib/call_page.dart
            app/lib/calls_page.dart
            app/lib/rooms_page.dart
            app/lib/gifts.dart
            app/test/realtime_session_test.dart
            app/test/renders/*.png
          retention-days: 7

  android-media-restart:
    needs: app-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 ../.github/ci/media-draft-assets.py
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos lib/group_draft_store.dart integration_test/native_group_draft_restart_test.dart
        working-directory: app
      - name: Seed, force-stop, relaunch without clearing package data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/ci/android-group-draft-restart.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-android-media-restart
          path: |
            app/build/screenshots/media_restart_*.png
            app/build/screenshots/process_death_*.log
          retention-days: 7
