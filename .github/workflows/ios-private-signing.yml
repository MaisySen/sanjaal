name: Sanjaal exact private build upload
on:
  push:
    branches: [ios-private-signing]
permissions:
  contents: read
  actions: read
concurrency:
  group: sanjaal-private-signing
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'MaisySen/sanjaal' && github.ref == 'refs/heads/ios-private-signing'
    environment: sanjaal-private-signing
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Upload the exact audited IPA to Apple, no rebuild or release
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
          SANJAAL_ARCHIVE_DECRYPT_KEY: ${{ secrets.SANJAAL_ARCHIVE_DECRYPT_KEY }}
          SANJAAL_UPLOAD_PASSWORD: ${{ secrets.SANJAAL_UPLOAD_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'UPLOAD'
          import pathlib,os,json,urllib.request,zipfile,subprocess,hashlib,shutil
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'sanjaal-upload';r.mkdir(mode=0o700)
          try:
           req=urllib.request.Request('https://api.github.com/repos/MaisySen/sanjaal/actions/artifacts/14693100640/zip',headers={'Authorization':'Bearer '+os.environ['GH_ARTIFACT_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(req) as response: (r/'artifact.zip').write_bytes(response.read())
           with zipfile.ZipFile(r/'artifact.zip') as z:
            assert z.namelist()==['sanjaal-private-archive.cms']
            z.extractall(r)
           (r/'decrypt.pem').write_text(os.environ['SANJAAL_ARCHIVE_DECRYPT_KEY'])
           result=subprocess.run(['openssl','cms','-decrypt','-binary','-inform','DER','-in',str(r/'sanjaal-private-archive.cms'),'-inkey',str(r/'decrypt.pem'),'-out',str(r/'payload.zip')],capture_output=True,text=True)
           if result.returncode: raise RuntimeError('Exact archive decryption failed')
           (r/'decrypt.pem').unlink()
           with zipfile.ZipFile(r/'payload.zip') as z:
            assert set(z.namelist())=={'audit.json','sanjaal-0.5.7-2012-appstore-signed.ipa'}
            z.extractall(r)
           ipa=r/'sanjaal-0.5.7-2012-appstore-signed.ipa'
           assert hashlib.sha256(ipa.read_bytes()).hexdigest()=='2a808b63f09500474eab38a42d4c619807ac7ef802e99aba3a3baf80697378ac'
           print('Exact audited IPA checksum verified. Uploading only, no review submission or tester distribution.',flush=True)
           env=os.environ.copy();env['SANJAAL_APP_UPLOAD_PASSWORD']=env.pop('SANJAAL_UPLOAD_PASSWORD')
           command=['xcrun','altool','--upload-app','--type','ios','--file',str(ipa),'--username','agentmaisy@gmail.com','--password','@env:SANJAAL_APP_UPLOAD_PASSWORD','--output-format','json']
           p=subprocess.run(command,env=env,capture_output=True,text=True,timeout=900)
           safe=p.stdout+'\n'+p.stderr
           for value in [os.environ.get('SANJAAL_UPLOAD_PASSWORD',''),os.environ.get('SANJAAL_ARCHIVE_DECRYPT_KEY','')]:
            if value: safe=safe.replace(value,'[redacted]')
           print(safe,flush=True)
           if p.returncode:raise RuntimeError('Apple upload returned nonzero status '+str(p.returncode))
           print('Apple upload command completed successfully; App Store Connect processing and compliance are still unverified.',flush=True)
          finally:
           shutil.rmtree(r,ignore_errors=True)
          UPLOAD
