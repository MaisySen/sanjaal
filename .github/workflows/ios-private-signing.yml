name: Sanjaal private identity preflight
on:
  push:
    branches: [ios-private-signing]
permissions:
  contents: read
concurrency:
  group: sanjaal-private-signing
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'MaisySen/sanjaal' && github.ref == 'refs/heads/ios-private-signing'
    environment: sanjaal-private-signing
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Test approved identity without app source or dependencies
        env:
          SIGNING_P12_B64: ${{ secrets.SANJAAL_SIGNING_P12_B64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SANJAAL_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'CHECK'
          import os,base64,pathlib,subprocess,hashlib,secrets
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'sanjaal-preflight';r.mkdir(mode=0o700)
          k=str(r/'check.keychain-db');p=secrets.token_urlsafe(32)
          try:
           (r/'identity.p12').write_bytes(base64.b64decode(os.environ['SIGNING_P12_B64'],validate=True))
           for cmd in [['security','create-keychain','-p',p,k],['security','set-keychain-settings','-lut','600',k],['security','unlock-keychain','-p',p,k],['security','import',str(r/'identity.p12'),'-P',os.environ['SIGNING_P12_PASSWORD'],'-A','-k',k],['security','list-keychains','-d','user','-s',k],['security','set-key-partition-list','-S','apple-tool:,apple:,codesign:','-k',p,k]]:
            result=subprocess.run(cmd,capture_output=True,text=True)
            if result.returncode:raise RuntimeError('Keychain stage failed: '+cmd[1]+'; '+result.stderr)
           ids=subprocess.check_output(['security','find-identity','-v','-p','codesigning',k],text=True)
           assert 'Apple Distribution' in ids and 'B85KQRQZW7' in ids, 'Approved identity is not usable'
           (r/'test.c').write_text('int main(void){return 0;}')
           subprocess.run(['xcrun','clang',str(r/'test.c'),'-o',str(r/'test')],check=True,capture_output=True)
           subprocess.run(['codesign','--force','--sign','Apple Distribution','--keychain',k,str(r/'test')],check=True,capture_output=True)
           subprocess.run(['codesign','--verify','--strict',str(r/'test')],check=True,capture_output=True)
           print('PASS: approved identity imported, located as valid codesigning identity, and signed a local throwaway executable; strict signature verification passed. No app built or uploaded.')
          finally:
           subprocess.run(['security','delete-keychain',k],capture_output=True)
           import shutil
           shutil.rmtree(r,ignore_errors=True)
          CHECK
