name: iOS simulator local flows
on:
  push:
    branches: [ios-direct-vm-attach]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring,pdo_sqlite,sqlite3,bcmath,gd
          coverage: none
      - name: Disposable local API, no production data or services
        working-directory: api
        env:
          APP_KEY: base64:Y2ktb25seS1rZXktbm90LWEtc2VjcmV0LTMyYnl0ZXM=
          APP_ENV: local
          DB_CONNECTION: sqlite
          DB_DATABASE: /tmp/ios-e2e/db.sqlite
          CACHE_STORE: file
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          mkdir -p /tmp/ios-e2e;touch /tmp/ios-e2e/db.sqlite .env
          php artisan migrate --force
          php tests/E2E/prepare.php /tmp/ios-e2e
          cp ../app/test/fixtures/ios_synthetic_video.mp4 public/ios-native-fixture.mp4
          echo "::add-mask::$(cat /tmp/ios-e2e/token.txt)"
          E2E_JWKS_FILE=/tmp/ios-e2e/jwks.json nohup php -S 127.0.0.1:8000 -t public tests/E2E/server.php > /tmp/ios-api.log 2>&1 &
          curl --retry 5 --retry-connrefused --retry-delay 1 -s http://localhost:8000/api/v1/auth/me -H 'Accept: application/json'
      - name: Select and boot available iPhone simulator
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available --json > /tmp/ios-devices.json
          python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/ios-devices.json'))
          eligible=[x for runtime,rows in d['devices'].items() if 'iOS' in runtime for x in rows if x['isAvailable'] and 'iPhone' in x['name']]
          assert eligible,'No installed iPhone simulator runtime'
          chosen=eligible[0]
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('IOS_DEVICE='+chosen['udid']+'\n')
          print(chosen)
          PY
      - name: Run actual iOS simulator application and native storage plugins
        working-directory: app
        run: |
          flutter pub get
          mkdir -p build/screenshots
          xcrun simctl boot "$IOS_DEVICE" || true
          xcrun simctl bootstatus "$IOS_DEVICE" -b
          xcrun simctl io "$IOS_DEVICE" recordVideo build/screenshots/ios-flows.mp4 > /tmp/ios-record.log 2>&1 &
          REC=$!
          # Compile once, then launch explicitly. Do not depend on the failed
          # Flutter simulator log-reader discovery path to find its VM service.
          flutter build ios --simulator --debug --target=integration_test/ios_flows_test.dart --no-pub --dart-define=API_BASE_URL=http://localhost:8000/api/v1 --dart-define=E2E_TOKEN_BASE=http://localhost:8000 --dart-define=E2E_TOKEN="$(cat /tmp/ios-e2e/token.txt)" > ios-build.log 2>&1
          xcrun simctl install "$IOS_DEVICE" build/ios/iphonesimulator/Runner.app
          # Debug-only simulator fixture, bind a fixed localhost port. Nothing
          # listens remotely and these arguments never enter a release build.
          xcrun simctl launch --console "$IOS_DEVICE" au.fintex.sanjaal --vm-service-host=127.0.0.1 --vm-service-port=57321 --disable-service-auth-codes > ios-native-console.log 2>&1 &
          LAUNCH=$!
          trap 'kill -INT "$REC" 2>/dev/null || true; kill "$LAUNCH" 2>/dev/null || true' EXIT
          set +e
          python3 - <<'PYDRIVE'
          import os,subprocess,signal,time,json,urllib.request,pathlib
          endpoint='http://127.0.0.1:57321/'
          deadline=time.monotonic()+90
          while True:
            try:
              with urllib.request.urlopen(endpoint+'getVM',timeout=2) as response:
                state=json.load(response)
              assert state.get('result',{}).get('type')=='VM',state
              pathlib.Path('ios-vm-probe.json').write_text(json.dumps(state,indent=2))
              print('Direct simulator VM service verified',flush=True)
              break
            except Exception as error:
              if time.monotonic()>deadline:
                print('Direct VM service unavailable within90s: '+str(error),flush=True)
                subprocess.run(['xcrun','simctl','spawn',os.environ['IOS_DEVICE'],'launchctl','list'])
                raise SystemExit(125)
              time.sleep(1)
          args=['flutter','drive','-d',os.environ['IOS_DEVICE'],'--driver=test_driver/integration_test.dart','--use-existing-app='+endpoint,'--no-pub']
          with open('ios-simulator.log','w') as log:
            child=subprocess.Popen(args,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
            try:code=child.wait(timeout=600)
            except subprocess.TimeoutExpired:
              print('Existing-app iOS driver exceeded10-minute diagnostic bound',flush=True)
              subprocess.run(['xcrun','simctl','io',os.environ['IOS_DEVICE'],'screenshot','build/screenshots/ios-timeout-native.png'])
              os.killpg(child.pid,signal.SIGTERM)
              try:child.wait(timeout=15)
              except subprocess.TimeoutExpired:os.killpg(child.pid,signal.SIGKILL)
              code=124
          raise SystemExit(code)
          PYDRIVE
          RC=$?
          kill -INT "$REC";wait "$REC"
          xcrun simctl io "$IOS_DEVICE" screenshot build/screenshots/ios-final-native.png
          tail -50 ios-simulator.log
          exit "$RC"
      - name: Preserve native diagnostic state even after a drive failure
        if: always()
        working-directory: app
        run: |
          mkdir -p build/screenshots
          if [ -n "$IOS_DEVICE" ]; then
            xcrun simctl io "$IOS_DEVICE" screenshot build/screenshots/ios-diagnostic-native.png || true
            CONTAINER=$(xcrun simctl get_app_container "$IOS_DEVICE" au.fintex.sanjaal data 2>/dev/null || true)
            if [ -n "$CONTAINER" ]; then
              find "$CONTAINER" -name ios-stages.log -exec cp {} build/screenshots/ios-stages.log \; || true
              find "$CONTAINER" -type d -name ios-evidence -exec cp -R {} build/screenshots/ \; || true
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-local-evidence
          path: |
            app/ios-simulator.log
            app/ios-build.log
            app/ios-native-console.log
            app/ios-vm-probe.json
            app/build/screenshots/*
            /tmp/ios-api.log
            /tmp/ios-devices.json
          retention-days: 7
