name: Memory video Android pause failure containment
on:
  push:
    branches: [memory-video-native-pause, memory-video-native-setup, product-integrated-overnight]
permissions:
  contents: read
jobs:
  native-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash .github/ci/test-native-memory-video.sh > native-protected.log 2>&1
      - run: python3 .github/ci/native-memory-video-pause-negatives.py
      - run: python3 .github/ci/native-memory-video-negatives.py
      - run: bash .github/ci/test-native-memory-video.sh > native-restored.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-memory-pause-evidence
          path: native-*.log
          retention-days: 7
  android-media-restart:
    if: github.ref == 'refs/heads/memory-video-native-pause' || github.ref == 'refs/heads/memory-video-native-setup'
    needs: native-adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: python3 -m pip install --target /tmp/sj-pixel-deps Pillow==11.3.0
      - run: echo 'PYTHONPATH=/tmp/sj-pixel-deps' >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 ../.github/ci/media-draft-assets.py
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos lib/memory_video_preview.dart integration_test/native_memory_video_restart_test.dart
        working-directory: app
      - name: Seed, force-stop, relaunch without clearing package data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/ci/android-memory-video-restart.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-video-android-native
          path: |
            app/build/screenshots/memory_video_*.png
            app/build/screenshots/process_death_*.log
          retention-days: 7
