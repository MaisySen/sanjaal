name: Encrypted video memory playback
on:
  push:
    branches: [recovered-video-memory-preview]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: timeout --kill-after=15s 240 flutter test test/memory_video_preview_test.dart test/creator_media_drafts_test.dart test/creator_media_draft_widgets_test.dart test/media_visibility_test.dart --reporter expanded > focused.log 2>&1
      - name: Native preview retirement negative control
        run: |
          cp lib/memory_video_preview.dart /tmp/memory-video-protected.dart
          trap 'cp /tmp/memory-video-protected.dart lib/memory_video_preview.dart' EXIT
          python3 - <<'PYCONTROL'
          from pathlib import Path
          p=Path('lib/memory_video_preview.dart');s=p.read_text();needle='void sessionRetired()=>_destroy();';assert needle in s;s=s.replace(needle,'void sessionRetired(){}',1);p.write_text(s)
          PYCONTROL
          set +e
          timeout --kill-after=10s 90 flutter test test/memory_video_preview_test.dart --plain-name 'same-owner generation retirement destroys player and removes controls' --reporter expanded > memory-negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' memory-negative.log
          cp /tmp/memory-video-protected.dart lib/memory_video_preview.dart
      - run: flutter test test/memory_video_preview_test.dart --reporter expanded > memory-restored.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-video-regression
          path: |
            app/*.log
            app/pubspec.lock
            app/lib/session_bound_state.dart
            app/lib/call_page.dart
            app/lib/calls_page.dart
            app/lib/rooms_page.dart
            app/lib/gifts.dart
            app/test/realtime_session_test.dart
            app/test/renders/*.png
          retention-days: 7

  android-media-restart:
    needs: app-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 ../.github/ci/media-draft-assets.py
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos lib/memory_video_preview.dart integration_test/native_memory_video_restart_test.dart
        working-directory: app
      - name: Seed, force-stop, relaunch without clearing package data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: sh .github/ci/android-memory-video-restart.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-video-android-native
          path: |
            app/build/screenshots/memory_video_*.png
            app/build/screenshots/process_death_*.log
          retention-days: 7
  ios-media-restart:
    needs: app-regression
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Select simulator
        run: |
          xcrun simctl list devices available --json > /tmp/devices.json
          python3 - <<'PYCODE'
          import json,os
          devices=json.load(open('/tmp/devices.json'))['devices']
          chosen=next(d for runtime,rows in devices.items() if 'iOS' in runtime for d in rows if d['isAvailable'] and 'iPhone' in d['name'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('IOS_DEVICE='+chosen['udid']+'\n')
          PYCODE
      - name: Build once and test same installed binary in two processes
        working-directory: app
        run: |
          python3 ../.github/ci/media-draft-assets.py
          flutter pub get
          mkdir -p build/screenshots
          xcrun simctl boot "$IOS_DEVICE" || true
          xcrun simctl bootstatus "$IOS_DEVICE" -b
          MARKER_ID=$(python3 -c 'import secrets;print(secrets.token_hex(24))')
          flutter build ios --simulator --debug --target=integration_test/native_memory_video_restart_test.dart --dart-define=MARKER_ID="$MARKER_ID" --no-pub > build/screenshots/build.log 2>&1
          python3 ../.github/ci/ios-memory-video-restart.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-video-ios-native
          path: app/build/screenshots/*
          retention-days: 7
