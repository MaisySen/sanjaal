name: Play update state correctness
on:
  push:
    branches: [play-update-unknown-state]
permissions:
  contents: read
jobs:
  app-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos > analyze.log 2>&1
      - run: flutter test test/app_updates_test.dart --reporter expanded > focused.log 2>&1
      - name: Historical false current negative control
        run: |
          cp lib/app_updates.dart /tmp/update-protected.dart
          trap 'cp /tmp/update-protected.dart lib/app_updates.dart' EXIT
          git show cc81116883952e7492531037901260306847a4f9:app/lib/app_updates.dart > lib/app_updates.dart
          set +e
          timeout --kill-after=10s 90 flutter test test/app_updates_test.dart --plain-name 'unknown and in-progress availability never claim current' --reporter expanded > negative.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          grep -q 'Actual:' negative.log
          cp /tmp/update-protected.dart lib/app_updates.dart
      - run: flutter test test/app_updates_test.dart --reporter expanded > restored.log 2>&1
      - run: flutter test --reporter expanded > test.log 2>&1
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://sanjaal-api.onrender.com/api/v1 > android-build.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: play-update-state-evidence
          path: |
            app/*.log
            app/test/renders/app_updates_*.png
          retention-days: 7
