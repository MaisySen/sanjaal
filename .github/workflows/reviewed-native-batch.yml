name: Reviewed compiler-only native batch
on:
  push:
    branches: [reviewed-native-batch-20261122]
permissions:
  contents: read
concurrency:
  group: reviewed-native-batch-20261122
  cancel-in-progress: false
jobs:
  android-fixture-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 .github/ci/reviewed-native-compile.py preflight
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Record compiler and resolve the locked Dart dependencies
        working-directory: app
        run: |
          flutter --version --machine > ../native-compile-report/flutter-version.json
          java -version 2> ../native-compile-report/java-version.txt
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock android ios
      - name: Compile debug local-fixture APK without launching or publishing it
        working-directory: app
        run: |
          flutter build apk --debug --target-platform android-arm64 --no-pub \
            --target integration_test/flows_test.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:8002/api/v1 \
            --dart-define=E2E_TOKEN_BASE=http://127.0.0.1:8002 \
            --dart-define=E2E_TOKEN=compiler-only-synthetic-not-a-credential
      - name: Record compiler-only evidence, not a delivery candidate
        run: python3 .github/ci/reviewed-native-compile.py collect android app/build/app/outputs/flutter-apk/app-debug.apk
      # No binary/log artifact upload, release, deploy, store access or app launch.
  ios-fixture-compile:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 .github/ci/reviewed-native-compile.py preflight
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Record actual compiler and simulator SDK, resolve locked Dart dependencies
        working-directory: app
        run: |
          flutter --version --machine > ../native-compile-report/flutter-version.json
          xcodebuild -version > ../native-compile-report/xcode-version.txt
          xcrun --sdk iphonesimulator --show-sdk-version > ../native-compile-report/simulator-sdk-version.txt
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock android ios
      - name: Compile simulator fixture without codesigning, launching or publishing it
        working-directory: app
        run: |
          flutter build ios --simulator --debug --no-codesign --no-pub \
            --target integration_test/ios_flows_test.dart \
            --dart-define=API_BASE_URL=http://127.0.0.1:8002/api/v1 \
            --dart-define=E2E_TOKEN_BASE=http://127.0.0.1:8002 \
            --dart-define=E2E_TOKEN=compiler-only-synthetic-not-a-credential
      - name: Record compiler-only evidence, not a delivery candidate
        run: python3 .github/ci/reviewed-native-compile.py collect ios app/build/ios/iphonesimulator/Runner.app
      # No binary/log artifact upload, release, deploy, store access or app launch.
