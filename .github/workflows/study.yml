name: Study run
on:
  push:
    branches: ['thopla-study']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch package
        run: |
          curl -sL -o pkg.zip "https://drive.usercontent.google.com/download?id=${{ vars.PKG_ID || '1D_pUWWKYF9anx0kiaQxRsYluO21bB8RO' }}&export=download&confirm=t"
          file pkg.zip; mkdir -p pkg && unzip -q -o pkg.zip -d pkg && ls -la pkg
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash study/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-out
          path: out/
      - name: Temporary results branch
        if: always()
        run: |
          mkdir -p /tmp/res && cp out/*.png out/*.xml /tmp/res/ 2>/dev/null || true
          ls /tmp/res | head -50
          cd /tmp/res && git init -q -b study-tmp && git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm results || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" study-tmp
