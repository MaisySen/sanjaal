name: Study run
on:
  push:
    branches: ['thopla-study']
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fetch package
        run: |
          curl -sL -o pkg.zip "https://drive.usercontent.google.com/download?id=${{ vars.PKG_ID || '1D_pUWWKYF9anx0kiaQxRsYluO21bB8RO' }}&export=download&confirm=t"
          file pkg.zip; mkdir -p pkg && unzip -q -o pkg.zip -d pkg && ls -la pkg
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash study/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-out
          path: out/
      - name: One-time share of results
        if: always()
        run: |
          zip -qr study-out.zip out || true
          curl -s -F "file=@study-out.zip" "https://file.io/?expires=1d&maxDownloads=1" | tee share.json || true
          echo; cat share.json
          echo "::notice title=share::$(cat share.json)"
