name: Wallet session retirement
on:
  push:
    branches: [hardening-wallet-session]
permissions:
  contents: read
jobs:
  fixture-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: false
      - working-directory: app
        run: |
          flutter pub get
          flutter test --reporter expanded test/wallet_session_test.dart test/wallet_journey_test.dart test/wallet_transfer_store_test.dart
          flutter analyze lib/wallet_page.dart test/wallet_session_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wallet-session-synthetic-renders
          path: app/test/renders/wallet_retired_*.png
          retention-days: 2
