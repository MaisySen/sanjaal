org.gradle.jvmargs=-Xmx3g -Xms512m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Keep split APKs and AABs in one monotonic version-code sequence.
# The held stable-key ARM64 APK used 2007; the next candidate starts at 2008.
force-version-code-ignoring-abi=true
